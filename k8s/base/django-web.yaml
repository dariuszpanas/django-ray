apiVersion: apps/v1
kind: Deployment
metadata:
  name: django-web
  namespace: django-ray
  labels:
    app: django-ray
    component: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: django-ray
      component: web
  template:
    metadata:
      labels:
        app: django-ray
        component: web
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z postgres-svc 5432; do echo waiting for postgres; sleep 2; done;
        - name: run-migrations
          image: django-ray:latest
          imagePullPolicy: IfNotPresent
          args:
            - migrate
          envFrom:
            - configMapRef:
                name: django-ray-config
          env:
            - name: DJANGO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: django-ray-runtime
                  key: DJANGO_SECRET_KEY
            - name: DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: django-ray-runtime
                  key: DATABASE_USER
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: django-ray-runtime
                  key: DATABASE_PASSWORD
            - name: DJANGO_API_ENABLED
              value: 'false'
        - name: collect-static
          image: django-ray:latest
          imagePullPolicy: IfNotPresent
          args:
            - collectstatic
          envFrom:
            - configMapRef:
                name: django-ray-config
          volumeMounts:
            - name: static-files
              mountPath: /app/staticfiles
          env:
            - name: DJANGO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: django-ray-runtime
                  key: DJANGO_SECRET_KEY
            - name: DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: django-ray-runtime
                  key: DATABASE_USER
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: django-ray-runtime
                  key: DATABASE_PASSWORD
            - name: DJANGO_API_ENABLED
              value: 'false'
      containers:
        - name: django-web
          image: django-ray:latest
          imagePullPolicy: IfNotPresent
          args:
            - web
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: django-ray-config
          env:
            - name: GUNICORN_WORKERS
              value: '2'
            - name: GUNICORN_THREADS
              value: '4'
            - name: DJANGO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: django-ray-runtime
                  key: DJANGO_SECRET_KEY
            - name: DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: django-ray-runtime
                  key: DATABASE_USER
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: django-ray-runtime
                  key: DATABASE_PASSWORD
            - name: DJANGO_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: django-ray-secret
                  key: DJANGO_API_TOKEN
            - name: DJANGO_METRICS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: django-ray-metrics
                  key: DJANGO_METRICS_TOKEN
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: 500m
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
              httpHeaders:
                - name: Host
                  value: django-ray.example.com
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
              httpHeaders:
                - name: Host
                  value: django-ray.example.com
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts:
            - name: static-files
              mountPath: /app/staticfiles
            - name: runtime-env
              mountPath: /runtime-env
              readOnly: true
            - name: payload-storage
              mountPath: /payload-storage
      volumes:
        - name: static-files
          emptyDir: {}
        - name: runtime-env
          persistentVolumeClaim:
            claimName: runtime-env-pvc
        - name: payload-storage
          persistentVolumeClaim:
            claimName: payload-storage-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: django-web-svc
  namespace: django-ray
  labels:
    app: django-ray
    component: web
spec:
  selector:
    app: django-ray
    component: web
  ports:
    - name: http
      port: 80
      targetPort: 8000
  type: ClusterIP
