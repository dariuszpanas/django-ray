name: Maintainer Approval Publisher

on:
  workflow_run:
    workflows: [Maintainer Approval Event]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  publish-current-maintainer-approval:
    name: Publish Current Maintainer Approval State
    if: >-
      github.event.workflow_run.path == '.github/workflows/maintainer-approval-event.yml' &&
      (github.event.workflow_run.event == 'pull_request_target' ||
      github.event.workflow_run.event == 'pull_request_review')
    concurrency:
      group: >-
        maintainer-approval-head-${{
        github.event.workflow_run.event == 'pull_request_review' &&
        github.event.workflow_run.head_sha ||
        fromJSON(github.event.workflow_run.display_title).head }}
      cancel-in-progress: true
    permissions:
      actions: read
      contents: read
      pull-requests: read
      statuses: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Invalidate current approval before evaluation setup
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: >-
            ${{ github.event.workflow_run.event == 'pull_request_review' &&
            github.event.workflow_run.head_sha ||
            fromJSON(github.event.workflow_run.display_title).head }}
          PUBLISHER_RUN_ID: ${{ github.run_id }}
          PUBLISHER_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          gh api --method POST \
            "/repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
            -f state=pending \
            -f context='Maintainer Approval' \
            -f description='Evaluating current-head maintainer approval' \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$PUBLISHER_RUN_ID/attempts/$PUBLISHER_RUN_ATTEMPT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Publish current maintainer approval state
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_HEAD: >-
            ${{ github.event.workflow_run.event == 'pull_request_review' &&
            github.event.workflow_run.head_sha ||
            fromJSON(github.event.workflow_run.display_title).head }}
          EXPECTED_HEAD: >-
            ${{ github.event.workflow_run.event == 'pull_request_review' &&
            github.event.workflow_run.head_sha ||
            fromJSON(github.event.workflow_run.display_title).head }}
          EXPECTED_PREVIOUS_HEAD: >-
            ${{ github.event.workflow_run.event == 'pull_request_review' &&
            github.event.workflow_run.head_sha ||
            fromJSON(github.event.workflow_run.display_title).previous }}
          EXPECTED_SOURCE_ACTION: >-
            ${{ github.event.workflow_run.event == 'pull_request_review' &&
            'review' || fromJSON(github.event.workflow_run.display_title).action }}
          PUBLISHER_RUN_ID: ${{ github.run_id }}
          PUBLISHER_RUN_ATTEMPT: ${{ github.run_attempt }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          python -m scripts.publish_maintainer_approval \
            --repository "$GITHUB_REPOSITORY" \
            --candidate-head "$CANDIDATE_HEAD" \
            --expected-head "$EXPECTED_HEAD" \
            --expected-previous-head "$EXPECTED_PREVIOUS_HEAD" \
            --expected-source-action "$EXPECTED_SOURCE_ACTION" \
            --source-workflow-run-id "$SOURCE_RUN_ID" \
            --publisher-workflow-run-id "$PUBLISHER_RUN_ID" \
            --publisher-workflow-run-attempt "$PUBLISHER_RUN_ATTEMPT"

  recover-displaced-maintainer-approval:
    name: Recover Displaced Maintainer Approval State
    if: >-
      github.event.workflow_run.path == '.github/workflows/maintainer-approval-event.yml' &&
      github.event.workflow_run.event == 'pull_request_target' &&
      fromJSON(github.event.workflow_run.display_title).action == 'synchronize' &&
      fromJSON(github.event.workflow_run.display_title).previous !=
      fromJSON(github.event.workflow_run.display_title).head
    concurrency:
      group: >-
        maintainer-approval-head-${{ fromJSON(github.event.workflow_run.display_title).previous }}
      cancel-in-progress: true
    permissions:
      actions: read
      contents: read
      pull-requests: read
      statuses: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Invalidate displaced approval before evaluation setup
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ fromJSON(github.event.workflow_run.display_title).previous }}
          PUBLISHER_RUN_ID: ${{ github.run_id }}
          PUBLISHER_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          gh api --method POST \
            "/repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
            -f state=pending \
            -f context='Maintainer Approval' \
            -f description='Evaluating displaced-head maintainer approval' \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$PUBLISHER_RUN_ID/attempts/$PUBLISHER_RUN_ATTEMPT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Publish displaced maintainer approval state
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_HEAD: ${{ fromJSON(github.event.workflow_run.display_title).previous }}
          EXPECTED_HEAD: ${{ fromJSON(github.event.workflow_run.display_title).head }}
          EXPECTED_PREVIOUS_HEAD: ${{ fromJSON(github.event.workflow_run.display_title).previous }}
          EXPECTED_SOURCE_ACTION: ${{ fromJSON(github.event.workflow_run.display_title).action }}
          PUBLISHER_RUN_ID: ${{ github.run_id }}
          PUBLISHER_RUN_ATTEMPT: ${{ github.run_attempt }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          python -m scripts.publish_maintainer_approval \
            --repository "$GITHUB_REPOSITORY" \
            --candidate-head "$CANDIDATE_HEAD" \
            --expected-head "$EXPECTED_HEAD" \
            --expected-previous-head "$EXPECTED_PREVIOUS_HEAD" \
            --expected-source-action "$EXPECTED_SOURCE_ACTION" \
            --source-workflow-run-id "$SOURCE_RUN_ID" \
            --publisher-workflow-run-id "$PUBLISHER_RUN_ID" \
            --publisher-workflow-run-attempt "$PUBLISHER_RUN_ATTEMPT"
