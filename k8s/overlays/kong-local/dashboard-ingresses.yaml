apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana-ingress
  namespace: django-ray
  labels:
    app.kubernetes.io/name: django-ray
    app.kubernetes.io/part-of: django-ray
spec:
  ingressClassName: kong
  rules:
    - host: grafana.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana-svc
                port:
                  number: 3000
---
