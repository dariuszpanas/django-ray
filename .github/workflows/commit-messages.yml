name: Commit Messages

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  conventional-commits:
    name: Commit Messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Validate PR title and commits
        if: github.event_name == 'pull_request_target'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          GH_TOKEN: ${{ github.token }}
          COMMIT_JSON_FILE: ${{ runner.temp }}/commit-subjects.json
          COMMIT_PAGES_FILE: ${{ runner.temp }}/commit-pages.json
        run: |
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/pulls/${{ github.event.pull_request.number }}/commits" \
            > "$COMMIT_PAGES_FILE"
          python - "$COMMIT_PAGES_FILE" "$COMMIT_JSON_FILE" <<'PY'
          import json
          import sys
          from pathlib import Path

          pages = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          subjects = [
              commit["commit"]["message"].splitlines()[0]
              for page in pages
              for commit in page
          ]
          Path(sys.argv[2]).write_text(json.dumps(subjects), encoding="utf-8")
          PY
          python scripts/check_conventional_commits.py \
            --title "$PR_TITLE" \
            --commit-json-file "$COMMIT_JSON_FILE"
