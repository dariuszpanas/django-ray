name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to rehearse on TestPyPI (e.g., 0.4.0)"
        required: true
        type: string
      candidate_sha:
        description: "Authorized full origin/main commit SHA"
        required: true
        type: string

permissions:
  contents: read

jobs:
  source-preflight:
    name: Verify Release Source
    runs-on: ubuntu-latest
    steps:
      - name: Validate manual candidate input
        if: github.event_name == 'workflow_dispatch'
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          if [[ ! "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::candidate_sha must be a lowercase full 40-character commit SHA"
            exit 1
          fi
          if [[ "$EVENT_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo "::error::manual release rehearsals must be dispatched from the default branch"
            exit 1
          fi
          if [[ "$CANDIDATE_SHA" != "$EVENT_SHA" ]]; then
            echo "::error::candidate_sha must match the workflow dispatch ref"
            exit 1
          fi

      - name: Check out manual candidate
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}

      - name: Check out production tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.ref }}

      - name: Confirm checked out manual candidate
        if: github.event_name == 'workflow_dispatch'
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          checked_out_sha="$(git rev-parse HEAD)"
          if [[ "$checked_out_sha" != "$CANDIDATE_SHA" || "$checked_out_sha" != "$EVENT_SHA" ]]; then
            echo "::error::the default branch changed after dispatch; start a new rehearsal"
            exit 1
          fi

      - name: Refresh release refs
        run: >-
          git fetch --force --prune --tags origin
          "+refs/heads/main:refs/remotes/origin/main"

      - name: Verify manual candidate source
        if: github.event_name == 'workflow_dispatch'
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          EVENT_SHA: ${{ github.sha }}
        run: >-
          python3 scripts/verify_release_source.py
          --manual-candidate "$CANDIDATE_SHA"
          --event-sha "$EVENT_SHA"

      - name: Verify production tag source
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          EVENT_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          python3 scripts/verify_release_source.py
          --production-tag "$RELEASE_TAG"
          --event-sha "$EVENT_SHA"

  dependency-audit:
    name: Runtime Dependency Audit (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    needs: source-preflight
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - name: Check out release candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.9.18"
          enable-cache: "false"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install locked audit dependencies
        run: >-
          uv sync --locked --only-group dev --no-install-project
          --python ${{ matrix.python-version }}

      - name: Audit locked runtime dependencies
        run: >-
          uv run --no-sync --python ${{ matrix.python-version }}
          python scripts/audit_runtime_dependencies.py

  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: [source-preflight, dependency-audit]
    outputs:
      version: ${{ steps.validate_testpypi_version.outputs.version || steps.validate_production_version.outputs.version }}
    steps:
      - name: Validate manual candidate input
        if: github.event_name == 'workflow_dispatch'
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          if [[ ! "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::candidate_sha must be a lowercase full 40-character commit SHA"
            exit 1
          fi
          if [[ "$EVENT_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo "::error::manual release rehearsals must be dispatched from the default branch"
            exit 1
          fi
          if [[ "$CANDIDATE_SHA" != "$EVENT_SHA" ]]; then
            echo "::error::candidate_sha must match the workflow dispatch ref"
            exit 1
          fi

      - name: Check out manual candidate
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}

      - name: Check out production tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.ref }}

      - name: Confirm checked out manual candidate
        if: github.event_name == 'workflow_dispatch'
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          checked_out_sha="$(git rev-parse HEAD)"
          if [[ "$checked_out_sha" != "$CANDIDATE_SHA" || "$checked_out_sha" != "$EVENT_SHA" ]]; then
            echo "::error::the default branch changed after dispatch; start a new rehearsal"
            exit 1
          fi

      - name: Refresh release refs
        run: >-
          git fetch --force --prune --tags origin
          "+refs/heads/main:refs/remotes/origin/main"

      - name: Verify manual candidate source
        if: github.event_name == 'workflow_dispatch'
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          EVENT_SHA: ${{ github.sha }}
        run: >-
          python3 scripts/verify_release_source.py
          --manual-candidate "$CANDIDATE_SHA"
          --event-sha "$EVENT_SHA"

      - name: Verify production tag source
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          EVENT_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          python3 scripts/verify_release_source.py
          --production-tag "$RELEASE_TAG"
          --event-sha "$EVENT_SHA"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.9.18"
          enable-cache: "false"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Validate changelog release tags
        run: >-
          uv run --no-sync python scripts/validate_release.py
          --development
          --require-git-tags
          --allow-release-candidate

      - name: Validate TestPyPI candidate version
        if: github.event_name == 'workflow_dispatch'
        id: validate_testpypi_version
        env:
          RELEASE_REF: ${{ inputs.version }}
        run: |
          version="$(
            uv run --no-sync python scripts/validate_release.py \
              --testpypi-candidate "$RELEASE_REF"
          )"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Validate production release version
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        id: validate_production_version
        env:
          RELEASE_REF: ${{ github.ref_name }}
        run: |
          version="$(uv run --no-sync python scripts/validate_release.py "$RELEASE_REF")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build package
        run: uv build

      - name: Upload dist artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  test:
    name: Test Built Package
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.9.18"
          enable-cache: "false"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Download dist artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Create venv and install built package
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install dist/*.whl

      - name: Verify distribution metadata and installed wheel
        run: >-
          uv run --no-sync python scripts/verify_wheel.py
          --version "${{ needs.build.outputs.version }}"
          --dist-dir dist

  publish-testpypi:
    name: Publish to TestPyPI
    runs-on: ubuntu-latest
    needs: [build, test]
    if: github.event_name == 'workflow_dispatch'
    environment:
      name: testpypi
      url: https://test.pypi.org/p/django-ray
    permissions:
      id-token: write
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build, test]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/p/django-ray
    permissions:
      id-token: write
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: publish-pypi
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download dist artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-alpha') || contains(github.ref, '-beta') || contains(github.ref, '-rc') }}

