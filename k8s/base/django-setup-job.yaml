apiVersion: batch/v1
kind: Job
metadata:
  name: django-setup
  namespace: django-ray
  labels:
    app: django-ray
    component: setup
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z postgres-svc 5432; do echo waiting for postgres; sleep 2; done;
      containers:
        - name: django-setup
          image: django-ray:latest
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -c
          args:
            - |
              set -euo pipefail

              echo "Running migrations..."
              python testproject/manage.py migrate --noinput

              echo "Collecting static files..."
              python testproject/manage.py collectstatic --noinput

              echo "Building shared RuntimeEnv source bundle..."
              python -m testproject.runtime_env_bundles \
                --base /app \
                --source-target /runtime-env/django-ray-source.zip \
                --recovery-target /runtime-env/django-ray-recovery.zip

              python -m testproject.bootstrap_superuser

              echo "Django setup complete!"
          envFrom:
            - configMapRef:
                name: django-ray-config
          volumeMounts:
            - name: runtime-env
              mountPath: /runtime-env
          env:
            - name: DJANGO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: django-ray-runtime
                  key: DJANGO_SECRET_KEY
            - name: DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: django-ray-runtime
                  key: DATABASE_USER
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: django-ray-runtime
                  key: DATABASE_PASSWORD
            - name: DJANGO_BOOTSTRAP_SUPERUSER
              valueFrom:
                secretKeyRef:
                  name: django-ray-bootstrap
                  key: DJANGO_BOOTSTRAP_SUPERUSER
            - name: DJANGO_SUPERUSER_USERNAME
              valueFrom:
                secretKeyRef:
                  name: django-ray-bootstrap
                  key: DJANGO_SUPERUSER_USERNAME
            - name: DJANGO_SUPERUSER_EMAIL
              valueFrom:
                secretKeyRef:
                  name: django-ray-bootstrap
                  key: DJANGO_SUPERUSER_EMAIL
            - name: DJANGO_SUPERUSER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: django-ray-bootstrap
                  key: DJANGO_SUPERUSER_PASSWORD
            - name: DJANGO_API_ENABLED
              value: 'false'
      volumes:
        - name: runtime-env
          persistentVolumeClaim:
            claimName: runtime-env-pvc
