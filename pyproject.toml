[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "django-ray"
version = "0.5.0"
description = "Ray-based backend for Django Tasks with distributed execution and database-backed reliability"
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.12"
authors = [
    { name = "Dariusz Panas" },
]
keywords = [
    "django",
    "ray",
    "distributed",
    "tasks",
    "background-tasks",
    "task-queue",
    "async",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 6.0",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Distributed Computing",
]
dependencies = [
    "cryptography>=42.0.8",
    "django>=6.0.8",
    "pyasn1>=0.6.4",
    "ray[default]>=2.56.0",
    "sqlparse>=0.6.0",
]

[project.urls]
Homepage = "https://github.com/dariuszpanas/django-ray"
Documentation = "https://django-ray.readthedocs.io/en/latest/"
Repository = "https://github.com/dariuszpanas/django-ray"
Issues = "https://github.com/dariuszpanas/django-ray/issues"

[project.optional-dependencies]
postgres = [
    "psycopg[binary]>=3.1",
]
s3 = [
    "boto3>=1.35.75",
]
gcs = [
    "google-cloud-storage>=2.18",
]
object-storage = [
    "boto3>=1.35.75",
    "google-cloud-storage>=2.18",
]
sample = [
    "django-ninja>=1.5.1",
    "django-unfold==0.104.1",
    "gunicorn>=23.0",
    "whitenoise>=6.6",
]

[dependency-groups]
dev = [
    "django-ninja>=1.5.1",
    "django-unfold==0.104.1",
    "whitenoise>=6.6",
    "ruff>=0.14.13",
    "ty>=0.0.12",
    "pytest>=8.3.3",
    "pytest-django>=4.7",
    "pytest-cov>=4.0",
    "pytest-xdist==3.8.0",
    "pyyaml>=6.0",
    "locust>=2.43",
    "pip-audit==2.10.1",
    "zensical>=0.0.42",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "C4",   # flake8-comprehensions
    "PIE",  # flake8-pie
]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["django_ray"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ty.environment]
python-version = "3.12"

[tool.ty.rules]
# Django ORM-related errors - ty doesn't have Django stubs yet
unresolved-attribute = "ignore"
invalid-argument-type = "ignore"
possibly-missing-attribute = "ignore"
invalid-assignment = "ignore"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "compiled_graph_opt_in: Runs the capability-gated native Compiled Graph probe on local Ray",
    "live_cluster: Uses a shared external Ray cluster and must run in its serial opt-in lane",
    "postgresql: Uses the PostgreSQL coordination database and must run in its serial evidence lane",
    "real_ray: Starts local Ray and must run serially without pytest-xdist",
]
filterwarnings = [
    # Suppress Ray's FutureWarning about accelerator env var override
    "ignore:Tip. In future versions of Ray:FutureWarning",
]

[tool.hatch.build.targets.wheel]
packages = ["src/django_ray"]

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
fail_under = 95
precision = 2
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
