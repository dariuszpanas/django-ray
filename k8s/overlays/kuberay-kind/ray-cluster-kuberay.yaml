apiVersion: ray.io/v1
kind: RayCluster
metadata:
  name: ray
  namespace: django-ray
  labels:
    app: ray
    component: cluster
spec:
  rayVersion: 2.56.0
  enableInTreeAutoscaling: false
  headGroupSpec:
    serviceType: ClusterIP
    rayStartParams:
      dashboard-host: 0.0.0.0
      dashboard-port: '8265'
      num-cpus: '2'
      metrics-export-port: '8080'
      disable-usage-stats: 'true'
    template:
      metadata:
        labels:
          app: ray
          component: head
        annotations:
          prometheus.io/scrape: 'true'
          prometheus.io/port: '8080'
          prometheus.io/path: /metrics
      spec:
        containers:
          - name: ray-head
            image: rayproject/ray:2.56.0-py312
            imagePullPolicy: IfNotPresent
            ports:
              - containerPort: 6379
                name: gcs
              - containerPort: 8265
                name: dashboard
              - containerPort: 10001
                name: client
              - containerPort: 8080
                name: metrics
            env:
              - name: RAY_DASHBOARD_HOST
                value: 0.0.0.0
              - name: RAY_METRICS_EXPORT_PORT
                value: '8080'
              - name: RAY_PROMETHEUS_HOST
                value: http://prometheus-svc:9090
              - name: RAY_GRAFANA_HOST
                value: http://grafana-svc:3000
              - name: RAY_GRAFANA_IFRAME_HOST
                value: http://localhost:30030
              - name: RAY_PROMETHEUS_NAME
                value: Prometheus
              - name: DJANGO_SECRET_KEY
                valueFrom:
                  secretKeyRef:
                    name: django-ray-runtime
                    key: DJANGO_SECRET_KEY
              - name: DATABASE_USER
                valueFrom:
                  secretKeyRef:
                    name: django-ray-runtime
                    key: DATABASE_USER
              - name: DATABASE_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: django-ray-runtime
                    key: DATABASE_PASSWORD
              - name: RAY_AUTH_MODE
                value: token
              - name: RAY_AUTH_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: django-ray-auth
                    key: RAY_AUTH_TOKEN
              - name: DJANGO_API_ENABLED
                value: 'false'
            envFrom:
              - configMapRef:
                  name: django-ray-config
            resources:
              requests:
                memory: 1Gi
                cpu: 500m
              limits:
                memory: 2Gi
                cpu: '2'
            volumeMounts:
              - name: ray-tmp
                mountPath: /tmp/ray
              - name: runtime-env
                mountPath: /runtime-env
                readOnly: true
              - name: payload-storage
                mountPath: /payload-storage
                readOnly: true
          - name: dashboard-importer
            image: python:3.12-slim
            imagePullPolicy: IfNotPresent
            command:
              - python3
              - /scripts/import_dashboards.py
            env:
              - name: GRAFANA_URL
                value: http://grafana-svc:3000
              - name: GF_SECURITY_ADMIN_USER
                valueFrom:
                  secretKeyRef:
                    name: django-ray-grafana
                    key: GF_SECURITY_ADMIN_USER
              - name: GF_SECURITY_ADMIN_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: django-ray-grafana
                    key: GF_SECURITY_ADMIN_PASSWORD
            volumeMounts:
              - name: ray-tmp
                mountPath: /tmp/ray
              - name: import-script
                mountPath: /scripts
            resources:
              requests:
                memory: 64Mi
                cpu: 50m
              limits:
                memory: 128Mi
                cpu: 100m
        volumes:
          - name: ray-tmp
            emptyDir: {}
          - name: import-script
            configMap:
              name: grafana-dashboard-import-script
              defaultMode: 493
          - name: runtime-env
            persistentVolumeClaim:
              claimName: runtime-env-pvc
          - name: payload-storage
            persistentVolumeClaim:
              claimName: payload-storage-pvc
  workerGroupSpecs:
    - groupName: worker-group
      replicas: 2
      minReplicas: 2
      maxReplicas: 2
      rayStartParams:
        num-cpus: '2'
        metrics-export-port: '8080'
      template:
        metadata:
          labels:
            app: ray
            component: worker
          annotations:
            prometheus.io/scrape: 'true'
            prometheus.io/port: '8080'
            prometheus.io/path: /metrics
        spec:
          containers:
            - name: ray-worker
              image: rayproject/ray:2.56.0-py312
              imagePullPolicy: IfNotPresent
              ports:
                - containerPort: 8080
                  name: metrics
              env:
                - name: RAY_PROMETHEUS_HOST
                  value: 0.0.0.0
                - name: RAY_METRICS_EXPORT_PORT
                  value: '8080'
                - name: DJANGO_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: django-ray-runtime
                      key: DJANGO_SECRET_KEY
                - name: DATABASE_USER
                  valueFrom:
                    secretKeyRef:
                      name: django-ray-runtime
                      key: DATABASE_USER
                - name: DATABASE_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: django-ray-runtime
                      key: DATABASE_PASSWORD
                - name: RAY_AUTH_MODE
                  value: token
                - name: RAY_AUTH_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: django-ray-auth
                      key: RAY_AUTH_TOKEN
                - name: DJANGO_API_ENABLED
                  value: 'false'
              envFrom:
                - configMapRef:
                    name: django-ray-config
              resources:
                requests:
                  memory: 1Gi
                  cpu: '1'
                limits:
                  memory: 3Gi
                  cpu: '2'
              volumeMounts:
                - name: runtime-env
                  mountPath: /runtime-env
                  readOnly: true
                - name: payload-storage
                  mountPath: /payload-storage
                  readOnly: true
          volumes:
            - name: runtime-env
              persistentVolumeClaim:
                claimName: runtime-env-pvc
            - name: payload-storage
              persistentVolumeClaim:
                claimName: payload-storage-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: ray-dashboard-svc
  namespace: django-ray
  labels:
    app: ray
    component: head
spec:
  selector:
    app: ray
    component: head
  ports:
    - name: dashboard
      port: 8265
      targetPort: 8265
  type: ClusterIP
