name: CI
run-name: >-
  ${{ github.event_name == 'pull_request' &&
  format('YAGA CI {0} for #{1} at base {2}', github.event.action,
  github.event.pull_request.number, github.event.pull_request.base.sha) ||
  format('CI {0} on {1}', github.event_name, github.ref_name) }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    if: github.event_name != 'pull_request_target'
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "latest"
          enable-cache: "false"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Check linting
        run: uv run ruff check .

  docs:
    if: github.event_name != 'pull_request_target'
    name: Docs Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "latest"
          enable-cache: "false"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Validate changelog release tags
        run: >-
          uv run python scripts/validate_release.py
          --development
          --require-git-tags
          --allow-release-candidate

      - name: Build docs
        run: make docs-build-strict

  typecheck:
    if: github.event_name != 'pull_request_target'
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "latest"
          enable-cache: "false"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Type check
        run: uv run ty check

  dependency-audit:
    if: github.event_name != 'pull_request_target'
    name: Runtime Dependency Audit (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "latest"
          enable-cache: "false"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install locked audit dependencies
        run: >-
          uv sync --locked --only-group dev --no-install-project
          --python ${{ matrix.python-version }}

      - name: Audit locked runtime dependencies
        run: >-
          uv run --no-sync --python ${{ matrix.python-version }}
          python scripts/audit_runtime_dependencies.py

  test:
    if: github.event_name != 'pull_request_target'
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    env:
      COVERAGE_GLOBAL_MIN: "95"
      COVERAGE_WORKER_MIN: "90"
      COVERAGE_RAY_JOB_MIN: "90"
      DJANGO_RAY_REQUIRE_KUSTOMIZE_PROBE_TESTS: "1"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "latest"
          enable-cache: "false"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen --python ${{ matrix.python-version }}

      - name: Run tests with suite timing
        if: matrix.python-version == '3.12'
        run: >-
          uv run --python ${{ matrix.python-version }} python
          scripts/test_suite_inventory.py run
          --lane supported-python
          --observation github-actions-ubuntu-py312
          --variant locked-dependencies
          --timing-output artifacts/test-suite-inventory/github-actions-py312.json
          --external-note "GitHub Actions queue and environment setup are recorded by workflow metadata; this record starts at pytest instrumentation"
          --
          --cov=src
          --cov-report=xml
          --cov-report=term
          --cov-fail-under=${{ env.COVERAGE_GLOBAL_MIN }}
          -v

      - name: Validate suite timing evidence
        if: matrix.python-version == '3.12'
        run: >-
          uv run --python ${{ matrix.python-version }} python
          scripts/test_suite_inventory.py collect
          --timing artifacts/test-suite-inventory/github-actions-py312.json
          --json-output artifacts/test-suite-inventory/github-actions-py312-inventory.json
          --markdown-output artifacts/test-suite-inventory/github-actions-py312-inventory.md

      - name: Upload suite timing evidence
        if: always() && matrix.python-version == '3.12'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-suite-timing-python-3.12
          path: artifacts/test-suite-inventory/
          if-no-files-found: warn
          retention-days: 14

      - name: Run tests
        if: matrix.python-version != '3.12'
        run: uv run --python ${{ matrix.python-version }} pytest -m "not live_cluster" --cov=src --cov-report=xml --cov-report=term --cov-fail-under=${{ env.COVERAGE_GLOBAL_MIN }} -v

      - name: Enforce worker module coverage
        if: matrix.python-version == '3.12'
        run: uv run coverage report --include="src/django_ray/management/commands/django_ray_worker.py" --fail-under=${{ env.COVERAGE_WORKER_MIN }}

      - name: Enforce ray job module coverage
        if: matrix.python-version == '3.12'
        run: uv run coverage report --include="src/django_ray/runner/ray_job.py" --fail-under=${{ env.COVERAGE_RAY_JOB_MIN }}

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  postgresql-coordination:
    if: github.event_name != 'pull_request_target'
    name: PostgreSQL Coordination & Polling
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DJANGO_SETTINGS_MODULE: tests.postgres_settings
      DATABASE_NAME: django_ray
      DATABASE_TEST_NAME: test_django_ray
      DATABASE_USER: django_ray
      DATABASE_PASSWORD: django_ray
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: "5432"
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: django_ray
          POSTGRES_USER: django_ray
          POSTGRES_PASSWORD: django_ray
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U django_ray -d django_ray"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "latest"
          enable-cache: "false"

      - name: Set up minimum supported Python
        run: uv python install 3.12

      - name: Install dependencies with PostgreSQL support
        run: |
          uv sync --frozen --extra postgres --python 3.12
          uv pip install --python .venv/bin/python "django==6.0.8" "sqlparse==0.6.0"

      - name: Report database test versions
        run: >-
          uv run --no-sync --python 3.12 python -c
          "import django, psycopg, sys; print(sys.version); print('Django', django.get_version()); print('psycopg', psycopg.__version__)"

      - name: Run PostgreSQL coordination and polling tests
        run: uv run --no-sync --python 3.12 make test-postgres

      - name: Show PostgreSQL diagnostics
        if: failure()
        run: |
          uv run --no-sync --python 3.12 python - <<'PY'
          import os
          import psycopg

          try:
              with psycopg.connect(
                  dbname=os.environ["DATABASE_NAME"],
                  user=os.environ["DATABASE_USER"],
                  password=os.environ["DATABASE_PASSWORD"],
                  host=os.environ["DATABASE_HOST"],
                  port=os.environ["DATABASE_PORT"],
              ) as connection:
                  with connection.cursor() as cursor:
                      cursor.execute("SELECT version(), current_database()")
                      print("PostgreSQL:", cursor.fetchone())
                      cursor.execute(
                          """
                          SELECT pid, state, wait_event_type, wait_event, left(query, 200)
                          FROM pg_stat_activity
                          WHERE datname = current_database()
                          ORDER BY pid
                          """
                      )
                      for activity in cursor.fetchall():
                          print("activity:", activity)
          except Exception as exc:
              print(f"PostgreSQL diagnostic connection failed: {type(exc).__name__}: {exc}")
              raise
          PY

  live-cluster:
    if: github.event_name != 'pull_request_target'
    name: Live Cluster Fault Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DJANGO_RAY_LIVE_CLUSTER_TESTS: "1"
      DJANGO_RAY_LIVE_RAY_ADDRESS: ray://127.0.0.1:10001
      DJANGO_RAY_LIVE_MIN_NODES: "2"
      DJANGO_RAY_LIVE_WORKING_DIR_URI: file:///tmp/django-ray-source.zip
      PYTHONUNBUFFERED: "1"
      RAY_ENABLE_UV_RUN_RUNTIME_ENV: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Start a two-node Ray cluster
        run: |
          docker network create django-ray-live-cluster
          docker run --detach --name ray-head \
            --network django-ray-live-cluster \
            --shm-size=1g \
            --publish 127.0.0.1:10001:10001 \
            rayproject/ray:2.56.0-py312 \
            bash -lc 'ray start --head --port=6379 \
              --ray-client-server-port=10001 --num-cpus=0 \
              --disable-usage-stats --block'
          docker run --detach --name ray-worker \
            --network django-ray-live-cluster \
            --shm-size=1g \
            rayproject/ray:2.56.0-py312 \
            bash -lc 'ray start --address=ray-head:6379 --num-cpus=1 \
              --disable-usage-stats --block'

      - name: Wait for two live Ray nodes
        run: |
          for attempt in $(seq 1 60); do
            live_nodes="$(docker exec ray-head python -c 'import logging; import ray; ray.init(address="ray-head:6379", logging_level=logging.ERROR); print(sum(node["Alive"] for node in ray.nodes()))' 2>/dev/null || true)"
            if [[ "$live_nodes" =~ ^[0-9]+$ && "$live_nodes" -ge 2 ]]; then
              echo "Ray cluster is ready with $live_nodes live nodes."
              exit 0
            fi
            echo "Waiting for two live Ray nodes (attempt $attempt/60; observed ${live_nodes:-0})."
            sleep 2
          done
          docker logs ray-head
          docker logs ray-worker
          exit 1

      - name: Stage the project RuntimeEnv on Ray nodes
        run: |
          git archive --format=zip --output=/tmp/django-ray-source.zip HEAD
          docker cp /tmp/django-ray-source.zip ray-head:/tmp/django-ray-source.zip
          docker cp /tmp/django-ray-source.zip ray-worker:/tmp/django-ray-source.zip
          docker exec ray-head python -c "import importlib.util; assert importlib.util.find_spec('django_ray') is None"
          docker exec ray-worker python -c "import importlib.util; assert importlib.util.find_spec('django_ray') is None"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "latest"
          enable-cache: "false"

      - name: Pin exact cluster Python
        run: |
          head_python="$(docker exec ray-head python -c 'import platform; print(platform.python_version())')"
          worker_python="$(docker exec ray-worker python -c 'import platform; print(platform.python_version())')"
          if [[ ! "$head_python" =~ ^3\.12\.[0-9]+$ ]]; then
            echo "::error title=Unexpected Ray Python::head reported a non-3.12 stable runtime."
            exit 1
          fi
          if [[ "$head_python" != "$worker_python" ]]; then
            echo "::error title=Mixed Ray Python::head and worker patch versions differ."
            exit 1
          fi
          echo "DJANGO_RAY_LIVE_PYTHON=$head_python" >> "$GITHUB_ENV"

      - name: Set up Python
        run: uv python install "$DJANGO_RAY_LIVE_PYTHON"

      - name: Install dependencies
        run: |
          uv sync --frozen --python "$DJANGO_RAY_LIVE_PYTHON"
          client_python="$(.venv/bin/python -c 'import platform; print(platform.python_version())')"
          if [[ "$client_python" != "$DJANGO_RAY_LIVE_PYTHON" ]]; then
            echo "::error title=Ray Client Python drift::installed client runtime differs from the cluster."
            exit 1
          fi

      - name: Verify Ray Client readiness
        timeout-minutes: 3
        run: |
          readiness_started_at="$(date +%s)"
          readiness_ready=0
          for attempt in 1 2; do
            echo "::group::Ray Client readiness attempt $attempt/2"
            echo "RAY_CLIENT_READINESS_START attempt=$attempt/2"
            attempt_started_at="$(date +%s)"
            set +e
            timeout --signal=TERM --kill-after=5s 70s \
              env RAY_CLIENT_INITIAL_CONNECTION_TIMEOUT_S=3 \
              RAY_CLIENT_MAX_CONNECTION_TIMEOUT_S=3 \
              .venv/bin/python - "$attempt" <<'PY'
          import faulthandler
          import logging
          import os
          import sys

          import ray

          attempt = sys.argv[1]
          required_nodes = int(os.environ["DJANGO_RAY_LIVE_MIN_NODES"])
          faulthandler.dump_traceback_later(45)
          try:
              ray.init(
                  address=os.environ["DJANGO_RAY_LIVE_RAY_ADDRESS"],
                  logging_level=logging.ERROR,
              )
              live_nodes = sum(bool(node.get("Alive")) for node in ray.nodes())
              if live_nodes < required_nodes:
                  raise RuntimeError(
                      f"Ray Client saw {live_nodes} live node(s); "
                      f"requires {required_nodes}"
                  )

              @ray.remote
              def readiness_probe():
                  return "ready"

              if ray.get(readiness_probe.remote(), timeout=10) != "ready":
                  raise RuntimeError("Ray Client task probe returned the wrong value")
              print(
                  "RAY_CLIENT_READINESS_CONNECTED "
                  f"attempt={attempt}/2 live_nodes={live_nodes}",
                  flush=True,
              )
          finally:
              ray.shutdown()
              faulthandler.cancel_dump_traceback_later()
          PY
            status="$?"
            set -e
            attempt_elapsed="$(( $(date +%s) - attempt_started_at ))"
            if [[ "$status" -eq 0 ]]; then
              echo "RAY_CLIENT_READINESS_PASS attempt=$attempt/2 elapsed_seconds=$attempt_elapsed"
              readiness_ready=1
            else
              echo "::warning title=Ray Client readiness retry::attempt $attempt/2 failed after ${attempt_elapsed}s (exit $status)."
            fi
            echo "::endgroup::"
            if [[ "$readiness_ready" -eq 1 ]]; then
              break
            fi
            if [[ "$attempt" -lt 2 ]]; then
              sleep 2
            fi
          done
          readiness_elapsed="$(( $(date +%s) - readiness_started_at ))"
          if [[ "$readiness_ready" -ne 1 ]]; then
            echo "::error title=Ray Client readiness exhausted::2 fresh-process attempts failed after ${readiness_elapsed}s."
            exit 1
          fi

      - name: Run isolated live cluster fault scenarios
        run: |
          live_cluster_scenarios=(
            "tests/integration/test_live_failure_injection.py::TestLiveFailureInjection::test_target_attestation_probes_every_package_free_ray_client_node"
            "tests/integration/test_live_failure_injection.py::TestLiveFailureInjection::test_ray_core_runner_submits_project_code_to_generic_cluster"
            "tests/integration/test_live_failure_injection.py::TestLiveFailureInjection::test_disconnect_retries_pending_ray_core_task"
            "tests/integration/test_live_failure_injection.py::TestLiveFailureInjection::test_cancellation_finalizes_live_pending_task"
          )
          for scenario in "${live_cluster_scenarios[@]}"; do
            echo "::group::Live cluster scenario: $scenario"
            echo "LIVE_CLUSTER_SCENARIO_START node_id=$scenario"
            started_at="$(date +%s)"
            set +e
            timeout --signal=TERM --kill-after=15s 165s \
              .venv/bin/python -m pytest "$scenario" -m live_cluster -vv -s \
              --setup-show -o faulthandler_timeout=90
            status="$?"
            set -e
            elapsed_seconds="$(( $(date +%s) - started_at ))"
            if [[ "$status" -eq 0 ]]; then
              echo "LIVE_CLUSTER_SCENARIO_PASS node_id=$scenario elapsed_seconds=$elapsed_seconds"
            elif [[ "$status" -eq 124 ]]; then
              echo "::error title=Live cluster scenario timed out::$scenario exceeded the 165-second TERM deadline (180-second hard ceiling; elapsed ${elapsed_seconds}s; exit $status)."
            elif [[ "$status" -eq 137 && "$elapsed_seconds" -ge 180 ]]; then
              echo "::error title=Live cluster scenario timed out::$scenario reached the 180-second forced-kill ceiling (elapsed ${elapsed_seconds}s; exit $status)."
            elif [[ "$status" -eq 137 ]]; then
              echo "::error title=Live cluster scenario was killed early::$scenario received SIGKILL before the timeout ceiling (elapsed ${elapsed_seconds}s; exit $status)."
            else
              echo "::error title=Live cluster scenario failed::$scenario failed after $elapsed_seconds seconds (exit $status)."
            fi
            echo "::endgroup::"
            if [[ "$status" -ne 0 ]]; then
              exit "$status"
            fi
          done

      - name: Show bounded Ray Client diagnostics
        if: always()
        run: |
          (
            docker exec ray-head bash -lc '
              shopt -s nullglob
              files=(/tmp/ray/session_latest/logs/ray_client_server*.err*)
              emitted=0
              for path in "${files[@]}"; do
                [[ -s "$path" ]] || continue
                emitted=1
                printf "===== %s (%s bytes) =====\n" \
                  "$(basename "$path")" "$(wc -c < "$path")"
                tail -n 400 "$path"
              done
              if [[ "$emitted" -eq 0 ]]; then
                echo "No non-empty ray_client_server*.err diagnostics found."
              fi
            ' 2>&1 || true
          ) | python3 scripts/bounded_redact.py \
            --max-chars 65536 \
            --secret-env DJANGO_API_TOKEN \
            --secret-env DJANGO_SECRET_KEY \
            --secret-env DATABASE_URL \
            --secret-env DATABASE_PASSWORD \
            --secret-env POSTGRES_PASSWORD \
            --secret-env GITHUB_TOKEN \
            --secret-env RAY_JOB_HEADERS \
            --secret-env AWS_ACCESS_KEY_ID \
            --secret-env AWS_SECRET_ACCESS_KEY \
            --secret-env AWS_SESSION_TOKEN

      - name: Show Ray container logs
        if: always()
        run: |
          docker logs ray-head || true
          docker logs ray-worker || true

      - name: Remove Ray containers
        if: always()
        run: |
          docker rm --force ray-worker ray-head || true
          docker network rm django-ray-live-cluster || true

  testproject:
    name: Testproject Smoke
    runs-on: ubuntu-latest
    env:
      COVERAGE_TESTPROJECT_MIN: "80"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "latest"
          enable-cache: "false"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Validate sample project
        run: uv run make test-testproject

  docker-compose-smoke:
    if: github.event_name != 'pull_request_target'
    name: Docker Compose Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate disposable credentials
        shell: bash
        run: |
          api_token="$(openssl rand -hex 32)"
          postgres_password="$(openssl rand -hex 32)"
          echo "::add-mask::$api_token"
          echo "::add-mask::$postgres_password"
          {
            printf 'DJANGO_API_TOKEN=%s\n' "$api_token"
            printf 'POSTGRES_PASSWORD=%s\n' "$postgres_password"
          } >> "$GITHUB_ENV"

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Start migrated web and worker services
        run: docker compose up --build --detach web worker

      - name: Run bounded authenticated task smoke
        run: docker compose --profile smoke run --rm --no-deps smoke

      - name: Show bounded Compose diagnostics
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --no-color --tail=200 postgres migrate web worker |
            python3 scripts/bounded_redact.py \
              --max-chars 65536 \
              --secret-env DJANGO_API_TOKEN \
              --secret-env POSTGRES_PASSWORD

      - name: Remove Compose resources
        if: always()
        run: docker compose --profile smoke down --volumes --remove-orphans

  dependency-compatibility:
    if: github.event_name != 'pull_request_target'
    name: Dependencies (${{ matrix.resolution }}, Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - resolution: minimum-direct
            python-version: "3.12"
          - resolution: latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "latest"
          enable-cache: "false"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install minimum supported dependencies
        if: matrix.resolution == 'minimum-direct'
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install --python .venv/bin/python \
            -e ".[sample]" \
            "cryptography==42.0.8" \
            "django==6.0.8" \
            "pyasn1==0.6.4" \
            "ray[default]==2.56.0" \
            "sqlparse==0.6.0" \
            "django-ninja==1.5.1" \
            "gunicorn==23.0" \
            "whitenoise==6.6" \
            "pytest==8.3.3" \
            "pytest-django==4.7" \
            "pytest-cov==4.0" \
            "pytest-xdist==3.8.0" \
            "locust==2.43.0"

      - name: Resolve and install latest dependencies
        if: matrix.resolution == 'latest'
        run: |
          uv lock --upgrade --python ${{ matrix.python-version }}
          uv sync --python ${{ matrix.python-version }}

      - name: Run tests
        run: >-
          uv run --no-sync --python ${{ matrix.python-version }}
          pytest -m "not live_cluster and not real_ray" -q

  ray-data-golden-path:
    if: github.event_name != 'pull_request_target'
    name: Ray Data (${{ matrix.profile }}, Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: supported-min-python
            python-version: "3.12"
            ray-version: "2.56.0"
          - profile: newest-python
            python-version: "3.14"
            ray-version: "2.56.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "latest"
          enable-cache: "false"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Run the real Ray Data boundary
        run: >-
          uv run --isolated --no-project --python ${{ matrix.python-version }}
          --with-editable ".[sample]"
          --with "ray[data]==${{ matrix.ray-version }}"
          python scripts/ray_data_golden_path_probe.py

  build:
    if: github.event_name != 'pull_request_target'
    name: Build Package
    runs-on: ubuntu-latest
    needs:
      [
        lint,
        docs,
        typecheck,
        dependency-audit,
        test,
        postgresql-coordination,
        live-cluster,
        testproject,
        docker-compose-smoke,
        dependency-compatibility,
        ray-data-golden-path,
      ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "latest"
          enable-cache: "false"

      - name: Set up Python
        run: uv python install 3.12

      - name: Build package
        run: uv build

      - name: Verify distribution metadata, installed wheel, and migrations
        run: |
          wheel="$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)"
          test -n "$wheel"
          uv run --isolated --no-project --python 3.12 \
            --with "$wheel" \
            python scripts/verify_wheel.py \
              --version "$(uv version --short)" \
              --dist-dir dist

      - name: Upload dist artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  ci-prerequisites:
    name: CI Prerequisites
    if: always()
    needs:
      - lint
      - docs
      - typecheck
      - dependency-audit
      - test
      - postgresql-coordination
      - live-cluster
      - testproject
      - docker-compose-smoke
      - dependency-compatibility
      - ray-data-golden-path
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Require every blocking CI job to succeed
        env:
          BLOCKING_JOB_RESULTS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os

          results = {
              job_id: details["result"]
              for job_id, details in json.loads(
                  os.environ["BLOCKING_JOB_RESULTS_JSON"]
              ).items()
          }
          if not results:
            raise SystemExit("CI Prerequisites blocked: no blocking job results")

          expected_jobs = {
              "build",
              "dependency-compatibility",
              "dependency-audit",
              "docs",
              "docker-compose-smoke",
              "lint",
              "live-cluster",
              "postgresql-coordination",
              "ray-data-golden-path",
              "test",
              "testproject",
              "typecheck",
          }
          received_jobs = set(results)
          if received_jobs != expected_jobs:
              missing = ",".join(sorted(expected_jobs - received_jobs)) or "-"
              unexpected = ",".join(sorted(received_jobs - expected_jobs)) or "-"
              raise SystemExit(
                  "CI Prerequisites blocked: result jobs mismatch; "
                  f"missing={missing}; unexpected={unexpected}"
              )

          for job_id, result in sorted(results.items()):
              print(f"{job_id}: {result}")

          unsuccessful = [
              f"{job_id}={result}"
              for job_id, result in sorted(results.items())
              if result != "success"
          ]
          if unsuccessful:
              raise SystemExit(
                  "CI Prerequisites blocked: " + ", ".join(unsuccessful)
              )
          PY

  legacy-ci-gate:
    name: >-
      ${{ vars.YAGA_CODEX_V2_ENABLED == 'true' &&
      'Legacy CI Gate' || 'CI Gate' }}
    if: always()
    needs: [ci-prerequisites]
    runs-on: ubuntu-latest
    steps:
      - name: Preserve the bootstrap CI Gate
        env:
          PREREQUISITES_RESULT: ${{ needs.ci-prerequisites.result }}
        run: |
          if [[ "$PREREQUISITES_RESULT" != "success" ]]; then
            echo "CI Gate blocked: CI Prerequisites=$PREREQUISITES_RESULT" >&2
            exit 1
          fi

