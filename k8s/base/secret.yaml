# Django-Ray shared Secret render reference for evaluation and local validation only.
# It deliberately combines credentials with different trust scopes. Production
# environments require externally managed, component-scoped credentials instead.
apiVersion: v1
kind: Secret
metadata:
  name: django-ray-secret
  namespace: django-ray
type: Opaque
stringData:
  # Placeholder values are not a production customization path.
  DJANGO_SECRET_KEY: "replace-with-a-random-secret-of-at-least-50-characters"
  DJANGO_API_TOKEN: "replace-with-a-random-api-token-of-at-least-32-characters"
  # Database credentials
  DATABASE_USER: "django_ray"
  DATABASE_PASSWORD: "django_ray_password"
  # PostgreSQL init (for postgres container)
  POSTGRES_USER: "django_ray"
  POSTGRES_PASSWORD: "django_ray_password"
  POSTGRES_DB: "django_ray"
  # Django superuser (for createsuperuser --noinput)
  DJANGO_SUPERUSER_USERNAME: "admin"
  DJANGO_SUPERUSER_EMAIL: "admin@example.com"
  DJANGO_SUPERUSER_PASSWORD: "admin123"

