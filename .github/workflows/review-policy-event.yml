name: Review Policy Event
run-name: >-
  {"v":1,
  "action":"${{ github.event.action }}",
  "pr":${{ github.event.pull_request.number }},
  "event":"${{ github.event_name }}",
  "head":"${{ github.event.pull_request.head.sha }}",
  "previous":"${{ github.event.before || github.event.pull_request.head.sha }}",
  "base":"${{ github.event.pull_request.base.sha }}",
  "base_ref":${{ toJSON(github.event.pull_request.base.ref) }},
  "base_changed":${{ github.event.changes.base != null }},
  "boundary":"${{ github.event.pull_request.updated_at }}"}

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review, converted_to_draft, closed]
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions: {}

jobs:
  observe-review-policy:
    name: Record Review Policy Event
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Record the unprivileged event boundary
        run: echo "A trusted default-branch publisher will evaluate live state."
