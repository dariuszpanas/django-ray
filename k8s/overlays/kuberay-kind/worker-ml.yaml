apiVersion: apps/v1
kind: Deployment
metadata:
  name: django-ray-worker-ml
  namespace: django-ray
  labels:
    app: django-ray
    component: worker
    queues: ml
spec:
  replicas: 1
  selector:
    matchLabels:
      app: django-ray
      component: worker
      queues: ml
  template:
    metadata:
      labels:
        app: django-ray
        component: worker
        queues: ml
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          command:
            - sh
            - -c
            - until nc -z postgres-svc 5432; do echo waiting for postgres; sleep 2; done;
        - name: wait-for-ray
          image: busybox:1.36
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          command:
            - sh
            - -c
            - until nc -z ray-head-svc 10001; do echo waiting for ray-head; sleep 2; done;
      containers:
        - name: django-ray-worker
          image: django-ray:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          command:
            - python
            - testproject/manage.py
            - django_ray_worker
          args:
            - --queue
            - ml
            - --cluster
            - ray://ray-head-svc:10001
            - --concurrency
            - '20'
          envFrom:
            - configMapRef:
                name: django-ray-config
          env:
            - name: DJANGO_RAY_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: RAY_ADDRESS
              value: ray://ray-head-svc:10001
            - name: DJANGO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: django-ray-runtime
                  key: DJANGO_SECRET_KEY
            - name: DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: django-ray-runtime
                  key: DATABASE_USER
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: django-ray-runtime
                  key: DATABASE_PASSWORD
            - name: RAY_AUTH_MODE
              value: token
            - name: RAY_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: django-ray-auth
                  key: RAY_AUTH_TOKEN
            - name: DJANGO_API_ENABLED
              value: 'false'
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: 500m
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - >-
                  exec python testproject/manage.py django_ray_worker_ready
                  --queue ml
                  --hostname "$DJANGO_RAY_POD_NAME" --json
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - >-
                  test -r /proc/1/stat &&
                  awk '{exit ($3=="Z"||$3=="X")?1:0}' /proc/1/stat &&
                  tr '\0' ' ' < /proc/1/cmdline | grep -q django_ray_worker
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
