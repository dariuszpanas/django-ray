name: Coverage Debt

on:
  schedule:
    - cron: "17 8 1 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage-debt-${{ github.repository }}
  cancel-in-progress: false

jobs:
  report:
    permissions:
      contents: read
      issues: write
    name: Monthly line-coverage debt report
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      COVERAGE_DEBT_SOURCE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "latest"
          enable-cache: "false"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install locked dependencies
        run: uv sync --frozen --python 3.12

      - name: Build exact coverage-debt reports
        run: uv run --no-sync --python 3.12 make coverage-debt

      - name: Add coverage-debt job summary
        if: always()
        run: |
          if [ -f artifacts/coverage-debt/coverage-phases.md ]; then
            cat artifacts/coverage-debt/coverage-phases.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Coverage-debt phase diagnostics were not produced." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f artifacts/coverage-debt/coverage-debt.md ]; then
            cat artifacts/coverage-debt/coverage-debt.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Coverage-debt reporting did not produce a Markdown report." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage-debt evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-debt-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/coverage-debt/coverage.py.json
            artifacts/coverage-debt/coverage-debt.json
            artifacts/coverage-debt/coverage-debt.md
            artifacts/coverage-debt/coverage-phases.json
            artifacts/coverage-debt/coverage-phases.md
            artifacts/coverage-debt/coverage-default-resources.log
            artifacts/coverage-debt/coverage-local-ray.log
            artifacts/coverage-debt/local-ray-timing.json
          if-no-files-found: warn
          retention-days: 30

      - name: Update the marked coverage-debt tracker
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          uv run --no-sync --python 3.12 python scripts/coverage_debt.py
          update-tracker
          --report-json artifacts/coverage-debt/coverage-debt.json
          --repository "$GITHUB_REPOSITORY"
