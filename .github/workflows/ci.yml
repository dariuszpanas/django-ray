name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  canonical-project:
    name: Canonical Project
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COVERAGE_GLOBAL_MIN: "95"
      COVERAGE_WORKER_MIN: "90"
      COVERAGE_RAY_JOB_MIN: "90"
      COVERAGE_TESTPROJECT_MIN: "80"
      DJANGO_RAY_REQUIRE_KUSTOMIZE_PROBE_TESTS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "latest"
          enable-cache: "false"

      - name: Set up Python
        run: uv python install 3.12.12

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Check formatting
        if: ${{ !cancelled() }}
        run: uv run --no-sync ruff format --check .

      - name: Check linting
        if: ${{ !cancelled() }}
        run: uv run --no-sync ruff check .

      - name: Type check
        if: ${{ !cancelled() }}
        run: uv run --no-sync ty check

      - name: Run serial source-fenced canonical coverage
        id: canonical-coverage
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          ray_alias=/tmp/drc
          if [[ -e "$ray_alias" || -L "$ray_alias" ]]; then
            echo "Canonical Ray alias must start absent: $ray_alias" >&2
            exit 2
          fi
          cleanup_ray_alias() {
            status=$?
            if [[ -L "$ray_alias" ]]; then
              unlink -- "$ray_alias" || status=2
            elif [[ -e "$ray_alias" ]]; then
              echo "Refusing to remove non-symlink Ray alias: $ray_alias" >&2
              status=2
            fi
            exit "$status"
          }
          trap cleanup_ray_alias EXIT
          ln -s "$PWD/artifacts/canonical-project" "$ray_alias"
          uv run --no-sync make test-cov-phased \
            TEST_SUITE_PHASED_OUTPUT_DIR=artifacts/canonical-project \
            TEST_SUITE_RAY_TMP_DIR=/tmp/drc/ray-tmp \
            TEST_SUITE_HERMETIC_EXECUTION=serial \
            TEST_SUITE_OBSERVATION=github-actions-canonical-py312 \
            TEST_SUITE_VARIANT=locked-dependencies \
            TEST_SUITE_EXTERNAL_NOTE="Workflow queue and environment setup are recorded by Actions separately from pytest timing."

      - name: Upload coverage to Codecov
        if: ${{ !cancelled() && steps.canonical-coverage.outcome == 'success' }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: artifacts/canonical-project/coverage.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Check bundled testproject
        if: ${{ !cancelled() }}
        run: uv run --no-sync python testproject/manage.py check

      - name: Build strict documentation
        if: ${{ !cancelled() }}
        run: uv run --no-sync make docs-build-strict

      - name: Build package
        id: package-build
        if: ${{ !cancelled() }}
        run: uv build

      - name: Validate canonical evidence completeness
        if: ${{ !cancelled() }}
        shell: bash
        env:
          CANONICAL_OUTCOME: ${{ steps.canonical-coverage.outcome }}
        run: |
          evidence=artifacts/canonical-project
          mkdir -p "$evidence"
          if [[ "$CANONICAL_OUTCOME" == "success" ]]; then
            required=(
              hermetic.json
              sqlite-django.json
              local-ray.json
              default-serial-remainder.json
              inventory.json
              inventory.md
              coverage.xml
              coverage.json
              ray-baseline.json
              ray-residue.json
            )
            for relative_path in "${required[@]}"; do
              test -s "$evidence/$relative_path" || {
                echo "Missing canonical evidence: $relative_path" >&2
                exit 2
              }
            done
          fi
          find "$evidence" -type f -not -path '*/ray-tmp/*' -print \
            | LC_ALL=C sort > "$evidence/manifest.txt"

      - name: Upload canonical diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: canonical-project-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/canonical-project/
            !artifacts/canonical-project/ray-tmp/**
            !artifacts/canonical-project/.coverage*
          if-no-files-found: error
          retention-days: 14

      - name: Upload distribution artifact
        if: ${{ !cancelled() && steps.package-build.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  compatibility:
    name: Compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "latest"
          enable-cache: "false"

      - name: Set up supported Python versions
        run: uv python install 3.12 3.13 3.14

      - name: Run four fresh compatibility variants
        id: compatibility-contracts
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p artifacts/compatibility
          overall_status=0
          isolation_failure=86

          run_variant() {
            local slug=$1
            local python_version=$2
            local resolution=$3
            local env_dir=$4
            local ray_alias=$5
            local evidence="artifacts/compatibility/${slug}"
            local python="${env_dir}/bin/python"
            local active_path="${env_dir}/bin:${PATH}"
            local portable_status=0
            local guard_status=0
            local alias_status=0
            local guard_state
            local ray_body_status
            local cleanup_status
            local source_state

            echo "::group::Compatibility ${slug}"
            if [[ -e "$env_dir" || -L "$env_dir" ]]; then
              echo "Fresh environment path must start absent: $env_dir" >&2
              echo "::endgroup::"
              return "$isolation_failure"
            fi
            if [[ -e "$ray_alias" || -L "$ray_alias" ]]; then
              echo "Ray alias must start absent: $ray_alias" >&2
              echo "::endgroup::"
              return "$isolation_failure"
            fi
            mkdir -p "$evidence"

            case "$resolution" in
              locked)
                if ! UV_PROJECT_ENVIRONMENT="$env_dir" \
                  uv sync --frozen --python "$python_version"; then
                  echo "Locked environment installation failed for $slug" >&2
                  echo "::endgroup::"
                  return 1
                fi
                ;;
              minimum)
                if ! uv venv --python "$python_version" "$env_dir"; then
                  echo "Minimum environment creation failed for $slug" >&2
                  echo "::endgroup::"
                  return 1
                fi
                if ! uv pip install --python "$python" \
                  -e . \
                  "django==6.0" \
                  "ray[default]==2.53.0" \
                  "django-ninja==1.5.1" \
                  "whitenoise==6.6" \
                  "pytest==7.0" \
                  "pytest-django==4.7" \
                  "pytest-cov==4.0" \
                  "pytest-xdist==3.8.0" \
                  "psutil==6.0.0"; then
                  echo "Minimum dependency installation failed for $slug" >&2
                  echo "::endgroup::"
                  return 1
                fi
                ;;
              latest)
                if ! uv venv --python "$python_version" "$env_dir"; then
                  echo "Latest environment creation failed for $slug" >&2
                  echo "::endgroup::"
                  return 1
                fi
                if ! uv pip install --python "$python" -e . --group dev; then
                  echo "Latest dependency installation failed for $slug" >&2
                  echo "::endgroup::"
                  return 1
                fi
                ;;
              *)
                echo "Unsupported compatibility resolution: $resolution" >&2
                echo "::endgroup::"
                return "$isolation_failure"
                ;;
            esac

            PATH="$active_path" \
            COMPATIBILITY_SLUG="$slug" \
            COMPATIBILITY_RESOLUTION="$resolution" \
            "$python" - <<'PY' > "$evidence/environment.json" || {
          import json
          import os
          import platform
          import sys

          print(
              json.dumps(
                  {
                      "platform": platform.platform(),
                      "python": sys.version,
                      "resolution": os.environ["COMPATIBILITY_RESOLUTION"],
                      "variant": os.environ["COMPATIBILITY_SLUG"],
                  },
                  indent=2,
                  sort_keys=True,
              )
          )
          PY
              echo "Environment evidence failed for $slug" >&2
              echo "::endgroup::"
              return 1
            }
            if ! uv pip freeze --python "$python" > "$evidence/packages.txt"; then
              echo "Package evidence failed for $slug" >&2
              echo "::endgroup::"
              return 1
            fi
            if ! "$python" scripts/ray_residue.py snapshot \
              --output "$evidence/ray-baseline.json"; then
              echo "Ray baseline failed for $slug" >&2
              echo "::endgroup::"
              return "$isolation_failure"
            fi
            if ! ln -s "$PWD/$evidence" "$ray_alias"; then
              echo "Ray alias creation failed for $slug" >&2
              echo "::endgroup::"
              return 1
            fi

            env PATH="$active_path" \
            "$python" scripts/test_suite_inventory.py run \
              --lane dependency-compatibility \
              --execution serial \
              --observation "github-actions-${slug}-portable" \
              --variant "$slug" \
              --timing-output "$evidence/dependency-compatibility.json" \
              --external-note "Actions records queue and fresh-environment setup outside pytest timing." \
              -- -q || portable_status=$?

            env PATH="$active_path" \
            "$python" scripts/ray_residue.py guard \
              --baseline "$evidence/ray-baseline.json" \
              --owned-temp-dir "$evidence/ray-tmp" \
              --output "$evidence/ray-residue.json" \
              -- "$python" scripts/test_suite_inventory.py run \
                --lane ray-compat-smoke \
                --execution serial \
                --observation "github-actions-${slug}-ray-compat" \
                --variant "$slug" \
                --timing-output "$evidence/ray-compat-smoke.json" \
                --ray-tmp-dir "$ray_alias/ray-tmp" \
                --external-note "Actions records queue and fresh-environment setup outside pytest timing." \
                -- -q || guard_status=$?

            if [[ -L "$ray_alias" ]]; then
              unlink -- "$ray_alias" || alias_status=2
            else
              echo "Ray alias was replaced or removed during $slug" >&2
              alias_status=2
            fi
            if [[ "$alias_status" -ne 0 ]]; then
              echo "::endgroup::"
              return "$isolation_failure"
            fi
            if [[ ! -s "$evidence/ray-residue.json" ]]; then
              echo "Ray residue evidence is missing for $slug" >&2
              echo "::endgroup::"
              return "$isolation_failure"
            fi
            guard_state="$(
              "$python" - "$evidence/ray-residue.json" <<'PY'
          import json
          import sys

          guard = json.load(open(sys.argv[1], encoding="utf-8"))["guard"]
          print(guard["body_returncode"], guard["cleanup_returncode"])
          PY
            )" || {
              echo "Ray guard evidence is malformed for $slug" >&2
              echo "::endgroup::"
              return "$isolation_failure"
            }
            read -r ray_body_status cleanup_status <<< "$guard_state"
            if [[ "$cleanup_status" != "0" ]]; then
              echo "Ray cleanup failed closed for $slug" >&2
              echo "::endgroup::"
              return "$isolation_failure"
            fi
            if [[ "$guard_status" != "$ray_body_status" ]]; then
              echo "Ray guard status mismatch for $slug" >&2
              echo "::endgroup::"
              return "$isolation_failure"
            fi
            if ! source_state="$(git status --porcelain=v1 --untracked-files=all)"; then
              echo "Compatibility source-state inspection failed for $slug" >&2
              echo "::endgroup::"
              return "$isolation_failure"
            fi
            if [[ -n "$source_state" ]]; then
              echo "Compatibility resolution modified tracked source or lock state" >&2
              printf '%s\n' "$source_state"
              echo "::endgroup::"
              return "$isolation_failure"
            fi
            echo "::endgroup::"

            if [[ "$portable_status" -ne 0 || "$ray_body_status" -ne 0 ]]; then
              return 1
            fi
            return 0
          }

          variant_status=0
          run_variant \
            locked-py313 3.13 locked \
            "$RUNNER_TEMP/django-ray-compat-locked-py313" \
            /tmp/drc313 || variant_status=$?
          if [[ "$variant_status" -eq "$isolation_failure" ]]; then
            exit "$variant_status"
          elif [[ "$variant_status" -ne 0 ]]; then
            overall_status=1
          fi

          variant_status=0
          run_variant \
            locked-py314 3.14 locked \
            "$RUNNER_TEMP/django-ray-compat-locked-py314" \
            /tmp/drc314 || variant_status=$?
          if [[ "$variant_status" -eq "$isolation_failure" ]]; then
            exit "$variant_status"
          elif [[ "$variant_status" -ne 0 ]]; then
            overall_status=1
          fi

          variant_status=0
          run_variant \
            minimum-py312 3.12 minimum \
            "$RUNNER_TEMP/django-ray-compat-minimum-py312" \
            /tmp/drcmin || variant_status=$?
          if [[ "$variant_status" -eq "$isolation_failure" ]]; then
            exit "$variant_status"
          elif [[ "$variant_status" -ne 0 ]]; then
            overall_status=1
          fi

          variant_status=0
          run_variant \
            latest-py314 3.14 latest \
            "$RUNNER_TEMP/django-ray-compat-latest-py314" \
            /tmp/drclat || variant_status=$?
          if [[ "$variant_status" -eq "$isolation_failure" ]]; then
            exit "$variant_status"
          elif [[ "$variant_status" -ne 0 ]]; then
            overall_status=1
          fi

          exit "$overall_status"

      - name: Validate compatibility evidence completeness
        if: ${{ !cancelled() }}
        shell: bash
        env:
          COMPATIBILITY_OUTCOME: ${{ steps.compatibility-contracts.outcome }}
        run: |
          evidence=artifacts/compatibility
          mkdir -p "$evidence"
          if [[ "$COMPATIBILITY_OUTCOME" == "success" ]]; then
            for slug in \
              locked-py313 locked-py314 minimum-py312 latest-py314; do
              for relative_path in \
                environment.json packages.txt dependency-compatibility.json \
                ray-compat-smoke.json ray-baseline.json ray-residue.json; do
                test -s "$evidence/$slug/$relative_path" || {
                  echo "Missing compatibility evidence: $slug/$relative_path" >&2
                  exit 2
                }
              done
            done
          fi
          find "$evidence" -type f -not -path '*/ray-tmp/*' -print \
            | LC_ALL=C sort > "$evidence/manifest.txt"

      - name: Upload compatibility evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compatibility-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/compatibility/
            !artifacts/compatibility/**/ray-tmp/**
          if-no-files-found: error
          retention-days: 14

  postgresql-coordination:
    name: PostgreSQL Coordination & Polling
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DJANGO_SETTINGS_MODULE: tests.postgres_settings
      DATABASE_NAME: django_ray
      DATABASE_TEST_NAME: test_django_ray
      DATABASE_USER: django_ray
      DATABASE_PASSWORD: django_ray
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: "5432"
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: django_ray
          POSTGRES_USER: django_ray
          POSTGRES_PASSWORD: django_ray
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U django_ray -d django_ray"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "latest"
          enable-cache: "false"

      - name: Set up minimum supported Python
        run: uv python install 3.12

      - name: Install dependencies with PostgreSQL support
        run: |
          uv sync --frozen --extra postgres --python 3.12
          uv pip install --python .venv/bin/python "django==6.0"

      - name: Report database test versions
        run: >-
          uv run --no-sync --python 3.12 python -c
          "import django, psycopg, sys; print(sys.version); print('Django', django.get_version()); print('psycopg', psycopg.__version__)"

      - name: Run PostgreSQL coordination and polling tests
        run: uv run --no-sync --python 3.12 make test-postgres

      - name: Show PostgreSQL diagnostics
        if: ${{ failure() && !cancelled() }}
        run: |
          uv run --no-sync --python 3.12 python - <<'PY'
          import os
          import psycopg

          try:
              with psycopg.connect(
                  dbname=os.environ["DATABASE_NAME"],
                  user=os.environ["DATABASE_USER"],
                  password=os.environ["DATABASE_PASSWORD"],
                  host=os.environ["DATABASE_HOST"],
                  port=os.environ["DATABASE_PORT"],
              ) as connection:
                  with connection.cursor() as cursor:
                      cursor.execute("SELECT version(), current_database()")
                      print("PostgreSQL:", cursor.fetchone())
                      cursor.execute(
                          """
                          SELECT pid, state, wait_event_type, wait_event, left(query, 200)
                          FROM pg_stat_activity
                          WHERE datname = current_database()
                          ORDER BY pid
                          """
                      )
                      for activity in cursor.fetchall():
                          print("activity:", activity)
          except Exception as exc:
              print(f"PostgreSQL diagnostic connection failed: {type(exc).__name__}: {exc}")
              raise
          PY

  live-cluster:
    name: Live Cluster Fault Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DJANGO_RAY_LIVE_CLUSTER_TESTS: "1"
      DJANGO_RAY_LIVE_RAY_ADDRESS: ray://127.0.0.1:10001
      DJANGO_RAY_LIVE_MIN_NODES: "2"
      DJANGO_RAY_LIVE_WORKING_DIR_URI: file:///tmp/django-ray-source.zip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Start a two-node Ray cluster
        run: |
          docker network create django-ray-live-cluster
          docker run --detach --name ray-head \
            --network django-ray-live-cluster \
            --shm-size=1g \
            --publish 127.0.0.1:10001:10001 \
            rayproject/ray:2.56.0-py312 \
            bash -lc 'ray start --head --port=6379 \
              --ray-client-server-port=10001 --num-cpus=0 \
              --disable-usage-stats --block'
          docker run --detach --name ray-worker \
            --network django-ray-live-cluster \
            --shm-size=1g \
            rayproject/ray:2.56.0-py312 \
            bash -lc 'ray start --address=ray-head:6379 --num-cpus=1 \
              --disable-usage-stats --block'

      - name: Wait for two live Ray nodes
        run: |
          for attempt in $(seq 1 60); do
            live_nodes="$(docker exec ray-head python -c 'import logging; import ray; ray.init(address="ray-head:6379", logging_level=logging.ERROR); print(sum(node["Alive"] for node in ray.nodes()))' 2>/dev/null || true)"
            if [[ "$live_nodes" =~ ^[0-9]+$ && "$live_nodes" -ge 2 ]]; then
              echo "Ray cluster is ready with $live_nodes live nodes."
              exit 0
            fi
            echo "Waiting for two live Ray nodes (attempt $attempt/60; observed ${live_nodes:-0})."
            sleep 2
          done
          docker logs ray-head
          docker logs ray-worker
          exit 1

      - name: Stage the project RuntimeEnv on Ray nodes
        run: |
          git archive --format=zip --output=/tmp/django-ray-source.zip HEAD
          docker cp /tmp/django-ray-source.zip ray-head:/tmp/django-ray-source.zip
          docker cp /tmp/django-ray-source.zip ray-worker:/tmp/django-ray-source.zip
          docker exec ray-head python -c "import importlib.util; assert importlib.util.find_spec('django_ray') is None"
          docker exec ray-worker python -c "import importlib.util; assert importlib.util.find_spec('django_ray') is None"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "latest"
          enable-cache: "false"

      - name: Set up Python
        run: uv python install 3.12.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run live cluster fault tests
        run: uv run --no-sync pytest tests/integration/test_live_failure_injection.py -m live_cluster -v

      - name: Show Ray container logs
        if: always()
        run: |
          docker logs ray-head || true
          docker logs ray-worker || true

      - name: Remove Ray containers
        if: always()
        run: |
          docker rm --force ray-worker ray-head || true
          docker network rm django-ray-live-cluster || true

  ci-gate:
    name: CI Gate
    if: always()
    needs:
      - canonical-project
      - compatibility
      - postgresql-coordination
      - live-cluster
    runs-on: ubuntu-latest
    steps:
      - name: Require every blocking CI job to succeed
        env:
          BLOCKING_JOB_RESULTS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os

          results = {
              job_id: details["result"]
              for job_id, details in json.loads(
                  os.environ["BLOCKING_JOB_RESULTS_JSON"]
              ).items()
          }
          if not results:
              raise SystemExit("CI Gate blocked: no blocking job results")

          expected_jobs = {
              "canonical-project",
              "compatibility",
              "live-cluster",
              "postgresql-coordination",
          }
          received_jobs = set(results)
          if received_jobs != expected_jobs:
              missing = ",".join(sorted(expected_jobs - received_jobs)) or "-"
              unexpected = ",".join(sorted(received_jobs - expected_jobs)) or "-"
              raise SystemExit(
                  "CI Gate blocked: result jobs mismatch; "
                  f"missing={missing}; unexpected={unexpected}"
              )

          for job_id, result in sorted(results.items()):
              print(f"{job_id}: {result}")

          unsuccessful = [
              f"{job_id}={result}"
              for job_id, result in sorted(results.items())
              if result != "success"
          ]
          if unsuccessful:
              raise SystemExit(
                  "CI Gate blocked: " + ", ".join(unsuccessful)
              )
          PY
