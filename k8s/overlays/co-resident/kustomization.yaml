# Local evaluation only; credentials are prepared separately.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: django-ray
resources:
  - ../../base
  - resource-policy.yaml
  - ray-cluster.yaml
patches:
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: prometheus
        namespace: django-ray
    target:
      kind: ServiceAccount
      name: prometheus
  - patch: |-
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: Role
      metadata:
        name: prometheus-django-ray
        namespace: django-ray
    target:
      kind: Role
      name: prometheus-django-ray
  - patch: |-
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: prometheus-django-ray
        namespace: django-ray
    target:
      kind: RoleBinding
      name: prometheus-django-ray
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: grafana-dashboard-import-script
        namespace: django-ray
    target:
      kind: ConfigMap
      name: grafana-dashboard-import-script
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: grafana-dashboards
        namespace: django-ray
    target:
      kind: ConfigMap
      name: grafana-dashboards
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: grafana-dashboards-provider
        namespace: django-ray
    target:
      kind: ConfigMap
      name: grafana-dashboards-provider
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: grafana-datasources
        namespace: django-ray
    target:
      kind: ConfigMap
      name: grafana-datasources
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: prometheus-config
        namespace: django-ray
    target:
      kind: ConfigMap
      name: prometheus-config
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata:
        name: grafana-svc
        namespace: django-ray
    target:
      kind: Service
      name: grafana-svc
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata:
        name: prometheus-svc
        namespace: django-ray
    target:
      kind: Service
      name: prometheus-svc
  - patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: grafana
        namespace: django-ray
    target:
      kind: Deployment
      name: grafana
  - patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: prometheus
        namespace: django-ray
    target:
      kind: Deployment
      name: prometheus
  - patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ray-head
        namespace: django-ray
    target:
      kind: Deployment
      name: ray-head
  - patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ray-worker
        namespace: django-ray
    target:
      kind: Deployment
      name: ray-worker
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata:
        name: ray-head-svc
        namespace: django-ray
    target:
      kind: Service
      name: ray-head-svc
  - patch: |
      - op: replace
        path: /data/DJANGO_DEPLOYMENT_MODE
        value: demo
      - op: replace
        path: /data/RAY_DASHBOARD_URL
        value: http://127.0.0.1:30265
    target:
      kind: ConfigMap
      name: django-ray-config
  - patch: |
      - op: add
        path: /spec/strategy
        value:
          type: Recreate
    target:
      kind: Deployment
  - patch: |
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 384Mi
    target:
      kind: Deployment
      name: postgres
  - patch: |
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 384Mi
    target:
      kind: Deployment
      name: django-web
  - patch: |
      - op: replace
        path: /spec/template/spec/containers/0/env
        value:
          - name: RAY_ADDRESS
            value: ray://ray-head-svc:10001
          - name: DJANGO_RAY_QUEUE
            value: default
          - name: DJANGO_RAY_CONCURRENCY
            value: '1'
          - name: DJANGO_SECRET_KEY
            valueFrom:
              secretKeyRef:
                name: django-ray-runtime
                key: DJANGO_SECRET_KEY
          - name: DATABASE_USER
            valueFrom:
              secretKeyRef:
                name: django-ray-runtime
                key: DATABASE_USER
          - name: DATABASE_PASSWORD
            valueFrom:
              secretKeyRef:
                name: django-ray-runtime
                key: DATABASE_PASSWORD
          - name: RAY_AUTH_MODE
            value: token
          - name: RAY_AUTH_TOKEN
            valueFrom:
              secretKeyRef:
                name: django-ray-auth
                key: RAY_AUTH_TOKEN
          - name: DJANGO_API_ENABLED
            value: 'false'
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 384Mi
    target:
      kind: Deployment
      name: django-ray-worker
  - patch: |
      - op: add
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 100m
            memory: 256Mi
    target:
      kind: Job
      name: django-setup
  - patch: |
      - op: replace
        path: /spec/type
        value: ClusterIP
    target:
      kind: Service
      name: django-web-svc
images:
  - name: django-ray
    newName: django-ray
    newTag: latest
