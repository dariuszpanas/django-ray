# Advisory shadow policy; existing required CI selection remains authoritative.
# Source snapshot: django-ray 0894832fabe8ab216c186c470548a15339b71e8e.
# The five rules preserve every trigger from scripts/qualification_policy.json.
# Full-on and unknown-path fallbacks deliberately make selection a conservative
# superset of that snapshot, not a promise of parity or a validated migration.
#
# This catalog covers ONLY the five existing long qualification workflows.
# Ordinary repository CI, backend tests, package checks, and other qualification
# workflows remain independently required. "Full" means this catalog's complete
# five-suite inventory; it does not establish complete repository qualification.
# Bindings identify existing fixed workflows; commands and secrets live outside
# this policy. First adoption must compare plans in shadow mode.

test-policy-version = 1
unknown-paths = "full"
full-on = [
  ".yaga/**",
  ".github/workflows/**",
  ".github/test-suite-taxonomy.json",
  "scripts/qualification_gate.py",
  "scripts/qualification_policy.json",
  "scripts/wait_for_ci_checkpoint.py",
  "pyproject.toml",
  "uv.lock",
  ".python-version",
  "Makefile",
  "mk/**",
  "Dockerfile",
  ".dockerignore",
  "docker-entrypoint.sh",
  "docker-compose.yml",
]
# These exclusions apply only to this long-qualification catalog. They never
# suppress the repository's mandatory documentation, policy, or ordinary CI.
no-impact = ["docs/**", "README.md", "LICENSE"]

[[suites]]
id = "qualification.application"
binding = "application-qualification"
tags = ["backend", "application", "kubernetes", "chainsaw", "long"]
requires = ["linux", "docker", "kind", "helm", "chainsaw"]
# Preserve the existing acceptance intent, standard resource profile, exact image
# and source identity, complete application receipts, and owned cleanup contract.
# Diagnostic runs cannot satisfy this suite's acceptance result.

[[suites]]
id = "qualification.native"
binding = "upgrade-native-qualification"
tags = ["backend", "upgrade", "docker", "long"]
variants = ["native", "jobs", "jobs-crash", "core-loss"]
requires = ["linux", "docker"]
# The fixed workflow binding runs the existing full matrix ONCE. Its adapter
# produces four cell receipts; these variants must not dispatch four full matrices.
# Preserve max-parallel=1, baseline archive identity checks, per-cell evidence,
# and verified removal of the owned Compose resources.

[[suites]]
id = "qualification.latency"
binding = "latency-qualification"
tags = ["backend", "performance", "docker", "long"]
requires = ["linux", "docker"]

[[suites]]
id = "qualification.cancellation"
binding = "cancellation-qualification"
tags = ["backend", "runtime", "docker", "long"]
requires = ["linux", "docker"]
# Preserve actual cancelled-driver exit observations, source/image identity,
# bounded receipts, and the existing owned-container cleanup verification.

[[suites]]
id = "qualification.monitoring"
binding = "monitoring-qualification"
tags = ["infrastructure", "monitoring", "kubernetes", "long"]
requires = ["linux", "docker", "kind", "helm"]
# Preserve monitoring assertion receipts and infrastructure-cleanup.json.
# Missing infrastructure or failed cleanup is incomplete/failed qualification.

[profiles.development]
mode = "selective"
always = []

[profiles.integration]
mode = "full"

[profiles.release]
mode = "full"

[[rules]]
id = "application"
when-any = [
  ".github/workflows/qualification-gate.yml",
  "scripts/qualification_gate.py",
  "scripts/qualification_policy.json",
  "tests/unit/test_qualification_gate.py",
  "scripts/wait_for_ci_checkpoint.py",
  ".github/workflows/application-qualification.yml",
  "qualification/application/**",
  "tests/unit/test_application_chainsaw.py",
  "tests/unit/test_application_core.py",
  "tests/unit/test_application_generation.py",
  "tests/unit/test_application_result_presentation.py",
  "tests/unit/test_application_runtime_env_refusal.py",
  "tests/unit/test_application_profile.py",
  "tests/unit/test_application_api_runner.py",
  "tests/unit/test_application_workflow_runner.py",
  "testproject/**",
  "src/django_ray/**",
  "Dockerfile",
  "docker-entrypoint.sh",
  "pyproject.toml",
  "uv.lock",
]
select = ["qualification.application"]

