# Local evaluation only; credentials are prepared separately.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: django-ray
resources:
  - ../../base
patches:
  - target:
      kind: ConfigMap
      name: django-ray-config
    patch: |
      - op: replace
        path: /data/DJANGO_DEPLOYMENT_MODE
        value: demo
  - target:
      kind: ConfigMap
      name: django-ray-config
    patch: |
      - op: replace
        path: /data/DJANGO_ALLOWED_HOSTS
        value: localhost,127.0.0.1,django-ray.localhost,django-web-svc
  - target:
      kind: Deployment
      name: django-web
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/readinessProbe/httpGet/httpHeaders/0/value
        value: django-ray.localhost
      - op: replace
        path: /spec/template/spec/containers/0/livenessProbe/httpGet/httpHeaders/0/value
        value: django-ray.localhost
  - target:
      kind: Deployment
      name: ray-head
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: RAY_USE_TLS
          value: '1'
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: RAY_TLS_SERVER_CERT
          value: /etc/ray/tls/tls.crt
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: RAY_TLS_SERVER_KEY
          value: /etc/ray/tls/tls.key
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: RAY_TLS_CA_CERT
          value: /etc/ray/tls/ca.crt
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts/-
        value:
          name: ray-tls
          mountPath: /etc/ray/tls
          readOnly: true
      - op: add
        path: /spec/template/spec/volumes/-
        value:
          name: ray-tls
          secret:
            secretName: ray-tls-certs
  - target:
      kind: Deployment
      name: ray-worker
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: RAY_USE_TLS
          value: '1'
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: RAY_TLS_SERVER_CERT
          value: /etc/ray/tls/tls.crt
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: RAY_TLS_SERVER_KEY
          value: /etc/ray/tls/tls.key
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: RAY_TLS_CA_CERT
          value: /etc/ray/tls/ca.crt
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts/-
        value:
          name: ray-tls
          mountPath: /etc/ray/tls
          readOnly: true
      - op: add
        path: /spec/template/spec/volumes/-
        value:
          name: ray-tls
          secret:
            secretName: ray-tls-certs
  - target:
      kind: Deployment
      name: django-ray-worker
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: RAY_USE_TLS
          value: '1'
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: RAY_TLS_SERVER_CERT
          value: /etc/ray/tls/tls.crt
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: RAY_TLS_SERVER_KEY
          value: /etc/ray/tls/tls.key
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: RAY_TLS_CA_CERT
          value: /etc/ray/tls/ca.crt
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts/-
        value:
          name: ray-tls
          mountPath: /etc/ray/tls
          readOnly: true
      - op: add
        path: /spec/template/spec/volumes/-
        value:
          name: ray-tls
          secret:
            secretName: ray-tls-certs
images:
  - name: django-ray
    newTag: dev
  - name: django-ray-worker
    newTag: dev
