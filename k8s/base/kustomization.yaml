# Local evaluation and maintainer validation only; credentials are provisioned separately.
# Do not treat this render reference as a production deployment template.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: django-ray
resources:
  - namespace.yaml
  - configmap.yaml
  - postgres.yaml
  - runtime-env-storage.yaml
  - payload-storage.yaml
  - ray-cluster.yaml
  - django-web.yaml
  - django-ray-worker.yaml
  - django-setup-job.yaml
  - monitoring.yaml
commonLabels:
  app.kubernetes.io/name: django-ray
  app.kubernetes.io/part-of: django-ray
images:
  - name: django-ray
    newName: django-ray
    newTag: latest
  - name: django-ray-worker
    newName: django-ray-worker
    newTag: latest
