# Local evaluation only; credentials are prepared separately.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: django-ray
resources:
  - ../../base
patches:
  - patch: |
      - op: replace
        path: /data/DJANGO_DEPLOYMENT_MODE
        value: demo
    target:
      kind: ConfigMap
      name: django-ray-config
  - patch: |
      - op: replace
        path: /data/DJANGO_ALLOWED_HOSTS
        value: localhost,127.0.0.1,django-ray.localhost
    target:
      kind: ConfigMap
      name: django-ray-config
  - patch: |
      - op: replace
        path: /data/DJANGO_DEBUG
        value: 'True'
    target:
      kind: ConfigMap
      name: django-ray-config
  - patch: |
      - op: replace
        path: /spec/replicas
        value: 2
    target:
      kind: Deployment
      name: ray-worker
  - patch: |
      - op: replace
        path: /spec/template/spec/containers/0/args
        value:
          - |
            ray start --head \
              --port=6379 \
              --dashboard-host=0.0.0.0 \
              --dashboard-port=8265 \
              --metrics-export-port=8080 \
              --num-cpus=4 \
              --memory=6000000000 \
              --object-store-memory=2000000000 \
              --disable-usage-stats \
              --block
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            memory: 6Gi
            cpu: '2'
          limits:
            memory: 10Gi
            cpu: '4'
    target:
      kind: Deployment
      name: ray-head
  - patch: |
      - op: replace
        path: /spec/template/spec/containers/0/args
        value:
          - |
            ray start \
              --address=ray-head-svc:6379 \
              --metrics-export-port=8080 \
              --num-cpus=4 \
              --memory=6000000000 \
              --object-store-memory=2000000000 \
              --block
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            memory: 6Gi
            cpu: '2'
          limits:
            memory: 10Gi
            cpu: '4'
    target:
      kind: Deployment
      name: ray-worker
  - patch: |
      - op: replace
        path: /spec/replicas
        value: 2
    target:
      kind: Deployment
      name: django-web
  - patch: |
      - op: replace
        path: /spec/template/spec/containers/0/env
        value:
          - name: GUNICORN_WORKERS
            value: '8'
          - name: GUNICORN_THREADS
            value: '4'
          - name: DJANGO_SECRET_KEY
            valueFrom:
              secretKeyRef:
                name: django-ray-runtime
                key: DJANGO_SECRET_KEY
          - name: DATABASE_USER
            valueFrom:
              secretKeyRef:
                name: django-ray-runtime
                key: DATABASE_USER
          - name: DATABASE_PASSWORD
            valueFrom:
              secretKeyRef:
                name: django-ray-runtime
                key: DATABASE_PASSWORD
          - name: DJANGO_API_TOKEN
            valueFrom:
              secretKeyRef:
                name: django-ray-secret
                key: DJANGO_API_TOKEN
          - name: DJANGO_METRICS_TOKEN
            valueFrom:
              secretKeyRef:
                name: django-ray-metrics
                key: DJANGO_METRICS_TOKEN
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            memory: 512Mi
            cpu: 500m
          limits:
            memory: 2Gi
            cpu: '2'
      - op: replace
        path: /spec/template/spec/containers/0/livenessProbe
        value:
          httpGet:
            path: /api/health
            port: 8000
            httpHeaders:
              - name: Host
                value: django-ray.localhost
          initialDelaySeconds: 30
          periodSeconds: 15
          timeoutSeconds: 10
          failureThreshold: 5
      - op: replace
        path: /spec/template/spec/containers/0/readinessProbe
        value:
          httpGet:
            path: /api/health
            port: 8000
            httpHeaders:
              - name: Host
                value: django-ray.localhost
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
    target:
      kind: Deployment
      name: django-web
  - patch: |
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            memory: 512Mi
            cpu: 500m
          limits:
            memory: 2Gi
            cpu: '2'
    target:
      kind: Deployment
      name: postgres
images:
  - name: django-ray
    newName: django-ray
    newTag: latest
  - name: django-ray-worker
    newName: django-ray-worker
    newTag: latest
