# Local evaluation only; credentials are prepared separately.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: django-ray
resources:
  - ../../base
  - ray-cluster-kuberay.yaml
  - worker-ml.yaml
  - worker-ray-job.yaml
  - worker-sync.yaml
patches:
  - patch: |
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: DJANGO_DEMO_WORKLOADS_ENABLED
          value: 'true'
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: DJANGO_DEMO_TOKEN
          valueFrom:
            secretKeyRef:
              name: django-ray-demo
              key: DJANGO_DEMO_TOKEN
    target:
      kind: Deployment
      name: django-web
  - patch: |
      - op: replace
        path: /data/DJANGO_DEPLOYMENT_MODE
        value: demo
    target:
      kind: ConfigMap
      name: django-ray-config
  - patch: |
      - op: replace
        path: /data/DJANGO_ALLOWED_HOSTS
        value: localhost,127.0.0.1,django-ray.localhost,django-web-svc
    target:
      kind: ConfigMap
      name: django-ray-config
  - patch: |
      - op: replace
        path: /spec/template/spec/containers/0/readinessProbe/httpGet/httpHeaders/0/value
        value: django-ray.localhost
      - op: replace
        path: /spec/template/spec/containers/0/livenessProbe/httpGet/httpHeaders/0/value
        value: django-ray.localhost
    target:
      kind: Deployment
      name: django-web
  - patch: |
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: DJANGO_RAY_RUNTIME_ENV_STORAGE_MODE
          value: encrypted
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: DJANGO_RAY_RUNTIME_ENV_ENCRYPTION_ACTIVE_KEY
          value: django-secret
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: DJANGO_RAY_RUNTIME_ENV_ENCRYPTION_DJANGO_SECRET_FALLBACK
          value: 'true'
    target:
      kind: Deployment
      name: django-web
  - patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ray-head
        namespace: django-ray
    target:
      kind: Deployment
      name: ray-head
  - patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ray-worker
        namespace: django-ray
    target:
      kind: Deployment
      name: ray-worker
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata:
        name: ray-head-svc
        namespace: django-ray
    target:
      kind: Service
      name: ray-head-svc
  - patch: |
      - op: replace
        path: /data/DJANGO_DEBUG
        value: 'True'
    target:
      kind: ConfigMap
      name: django-ray-config
  - patch: |
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Deployment
      name: django-ray-worker
  - patch: |
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: DJANGO_RAY_RUNTIME_ENV_STORAGE_MODE
          value: encrypted
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: DJANGO_RAY_RUNTIME_ENV_ENCRYPTION_ACTIVE_KEY
          value: django-secret
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: DJANGO_RAY_RUNTIME_ENV_ENCRYPTION_DJANGO_SECRET_FALLBACK
          value: 'true'
    target:
      kind: Deployment
      name: django-ray-worker
  - patch: |
      - op: add
        path: /spec/template/spec/containers/0/env
        value:
          - name: DJANGO_RAY_RUNTIME_ENV_STORAGE_MODE
            value: encrypted
          - name: DJANGO_RAY_RUNTIME_ENV_ENCRYPTION_ACTIVE_KEY
            value: django-secret
          - name: DJANGO_RAY_RUNTIME_ENV_ENCRYPTION_DJANGO_SECRET_FALLBACK
            value: 'true'
          - name: DJANGO_SECRET_KEY
            valueFrom:
              secretKeyRef:
                name: django-ray-runtime
                key: DJANGO_SECRET_KEY
          - name: DATABASE_USER
            valueFrom:
              secretKeyRef:
                name: django-ray-runtime
                key: DATABASE_USER
          - name: DATABASE_PASSWORD
            valueFrom:
              secretKeyRef:
                name: django-ray-runtime
                key: DATABASE_PASSWORD
          - name: DJANGO_API_ENABLED
            value: 'false'
    target:
      kind: Deployment
      name: django-ray-worker-sync
  - patch: |
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: DJANGO_RAY_RUNTIME_ENV_STORAGE_MODE
          value: encrypted
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: DJANGO_RAY_RUNTIME_ENV_ENCRYPTION_ACTIVE_KEY
          value: django-secret
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: DJANGO_RAY_RUNTIME_ENV_ENCRYPTION_DJANGO_SECRET_FALLBACK
          value: 'true'
    target:
      kind: Deployment
      name: django-ray-worker-ml
  - patch: |
      - op: add
        path: /spec/template/spec/containers/0/env
        value:
          - name: DJANGO_RAY_RUNTIME_ENV_STORAGE_MODE
            value: encrypted
          - name: DJANGO_RAY_RUNTIME_ENV_ENCRYPTION_ACTIVE_KEY
            value: django-secret
          - name: DJANGO_RAY_RUNTIME_ENV_ENCRYPTION_DJANGO_SECRET_FALLBACK
            value: 'true'
          - name: DJANGO_SECRET_KEY
            valueFrom:
              secretKeyRef:
                name: django-ray-runtime
                key: DJANGO_SECRET_KEY
          - name: DATABASE_USER
            valueFrom:
              secretKeyRef:
                name: django-ray-runtime
                key: DATABASE_USER
          - name: DATABASE_PASSWORD
            valueFrom:
              secretKeyRef:
                name: django-ray-runtime
                key: DATABASE_PASSWORD
          - name: RAY_AUTH_MODE
            value: token
          - name: RAY_AUTH_TOKEN
            valueFrom:
              secretKeyRef:
                name: django-ray-auth
                key: RAY_AUTH_TOKEN
          - name: DJANGO_API_ENABLED
            value: 'false'
    target:
      kind: Deployment
      name: django-ray-worker-ray-job
  - patch: |
      - op: replace
        path: /spec/template/spec/containers/0/env/1/value
        value: default,high-priority,low-priority
    target:
      kind: Deployment
      name: django-ray-worker
images:
  - name: django-ray
    newName: django-ray
    newTag: latest
  - name: django-ray-worker
    newName: django-ray-worker
    newTag: latest
