name: Upgrade Data Qualification

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/upgrade-qualification.yml
      - qualification/upgrade/**
      - qualification/transactions/Dockerfile
      - qualification/transactions/probe.py
      - qualification/docker/scenario.py
      - src/django_ray/migrations/**
      - src/django_ray/backends.py
      - src/django_ray/input_storage.py
      - src/django_ray/result_storage.py
      - pyproject.toml
      - uv.lock
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upgrade-data-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  runtime-images:
    name: Upgrade Runtime Images
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Export and build the two committed runtime images
        timeout-minutes: 21
        run: |
          set -euo pipefail
          # The disposable hosted VM bounds sequential builds. No shared cluster
          # or database is used, and this is not deployed upgrade acceptance.
          python -m qualification.upgrade.runtime_source "$RUNNER_TEMP/runtime-images" \
            --python-image python@sha256:2fe5997d249a808b8eeea52c58a1dbffbba28754dc11699ef5c029f2d818ce79 \
            --python-version 3.12.14
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "runtime-images"
          plan = json.loads((root / "source-plan.json").read_text())
          for epoch in ("baseline", "candidate"):
              command = plan["build_argv"][epoch]
              expected = f"type=oci,dest={root / (epoch + '.oci.tar')}"
              assert command.count("--output") == 1
              index = command.index("--output") + 1
              assert command[index] == expected
              command[index] = f"type=docker,name=django-ray-upgrade-{epoch}:local"
              command[3:3] = ["--platform", "linux/amd64", "--provenance=false"]
              subprocess.run(command, check=True, timeout=600)
          PY

      - name: Verify installed image identities without networking or Ray startup
        timeout-minutes: 2
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "runtime-images"
          plan = json.loads((root / "source-plan.json").read_text())
          probe = '''import importlib.metadata as m, json, platform
          from pathlib import Path
          import django_ray
          identity = json.loads(Path('/opt/runtime/identity.json').read_text())
          assert django_ray.__version__ == m.version('django-ray') == identity['package_version']
          assert m.version('ray') == identity['ray_version']
          assert platform.python_version() == identity['python_version']
          assert Path(django_ray.__file__).resolve().is_relative_to('/opt/runtime/venv')
          print(json.dumps(identity))
          '''
          for epoch in ("baseline", "candidate"):
              result = subprocess.run([
                  "docker", "run", "--rm", f"--name=upgrade-image-{epoch}",
                  "--network=none", "--read-only",
                  "--cpus=0.5", "--memory=512m", "--memory-swap=512m", "--pids-limit=128",
                  "--cap-drop=ALL", "--security-opt=no-new-privileges",
                  "--tmpfs=/tmp:rw,nosuid,nodev,size=32m,mode=1777",
                  f"django-ray-upgrade-{epoch}:local", "python", "-c", probe,
              ], check=True, capture_output=True, text=True, timeout=30)
              assert not result.stderr and len(result.stdout) < 16384
              identity = json.loads(result.stdout)
              source = plan["sources"][epoch]
              assert identity["build"] == epoch
              assert identity["source_commit"] == source["commit"]
              assert identity["source_archive_sha256"] == source["archive_sha256"]
              assert identity["qualifier_commit"] == plan["sources"]["candidate"]["commit"]
              assert identity["lock_sha256"] == source["lock_sha256"]
              assert identity["python_image"] == plan["python_image"]
              receipt = {"identity": identity, "complete_upgrade_gate": False}
              (root / f"{epoch}-image-identity.json").write_text(json.dumps(receipt, indent=2))
          PY

      - name: Remove owned image probes after success or timeout
        if: always()
        run: |
          set -euo pipefail
          for epoch in baseline candidate; do
            if docker container inspect "upgrade-image-$epoch" >/dev/null 2>&1; then
              docker container rm --force "upgrade-image-$epoch"
            fi
          done

      - name: Retain source and image evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: upgrade-runtime-images
          retention-days: 30
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/runtime-images/source-plan.json
            ${{ runner.temp }}/runtime-images/*-image-identity.json

  data:
    name: Upgrade Data Qualification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: upgrade-data-qualification
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Export exact released and candidate source archives
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          export UPGRADE_BASELINE_SOURCE="$RUNNER_TEMP/upgrade-released"
          python -m qualification.upgrade.prepare "$UPGRADE_BASELINE_SOURCE"
          sha256sum "$UPGRADE_BASELINE_SOURCE/source.tar" | cut -d ' ' -f 1 > "$RUNNER_TEMP/upgrade-baseline-sha256.txt"
          source_dir="$RUNNER_TEMP/upgrade-candidate"
          mkdir -m 755 "$source_dir"
          git archive HEAD | tar -x -C "$source_dir"
          export UPGRADE_EVIDENCE_DIR="$RUNNER_TEMP/upgrade-receipts"
          mkdir -m 700 "$UPGRADE_EVIDENCE_DIR"
          sudo chown 10001:10001 "$UPGRADE_EVIDENCE_DIR"
          echo "UPGRADE_BASELINE_SOURCE=$UPGRADE_BASELINE_SOURCE" >> "$GITHUB_ENV"
          echo "UPGRADE_EVIDENCE_DIR=$UPGRADE_EVIDENCE_DIR" >> "$GITHUB_ENV"
          echo "COMPOSE_FILE=$source_dir/qualification/upgrade/data.yaml" >> "$GITHUB_ENV"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/upgrade-source.txt"

      - name: Build the two locked installed-wheel environments
        timeout-minutes: 12
        run: |
          docker compose config --quiet
          docker compose build data
          docker image inspect django-ray-upgrade-qualification:local --format '{{.Id}}' > "$RUNNER_TEMP/upgrade-image.txt"

      - name: Rehearse SQLite and PostgreSQL preservation and independent restoration
        run: |
          set -o pipefail
          timeout --signal=INT --kill-after=20s 900s \
            docker compose run --no-deps --rm data 2>&1 |
            tee "$RUNNER_TEMP/upgrade-execution.log"

      - name: Remove owned test resources
        if: always()
        run: |
          if [[ -n "$COMPOSE_FILE" ]]; then
            docker compose down --timeout 20 --remove-orphans
          fi
          if [[ -n "$UPGRADE_EVIDENCE_DIR" && -d "$UPGRADE_EVIDENCE_DIR" ]]; then
            sudo chown -R "$(id -u):$(id -g)" "$UPGRADE_EVIDENCE_DIR"
          fi
          test -z "$(docker ps -aq --filter label=com.docker.compose.project=upgrade-data-qualification)"

      - name: Match the runtime archive to the caller's exact Git export
        run: |
          python - "$RUNNER_TEMP/upgrade-baseline-sha256.txt" "$UPGRADE_EVIDENCE_DIR/execution-manifest.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          expected = Path(sys.argv[1]).read_text().strip()
          manifest = json.loads(Path(sys.argv[2]).read_text())
          assert manifest["baseline_archive_sha256"] == expected, "released archive differs from caller export"
          PY

      - name: Retain database-stage evidence and explicit remaining acceptance
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: upgrade-data-qualification
          retention-days: 30
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/upgrade-receipts/
            ${{ runner.temp }}/upgrade-source.txt
            ${{ runner.temp }}/upgrade-baseline-sha256.txt
            ${{ runner.temp }}/upgrade-image.txt
            ${{ runner.temp }}/upgrade-execution.log
