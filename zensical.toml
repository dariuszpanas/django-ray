[project]
site_name = "django-ray"
site_description = "Ray-based backend for Django Tasks with distributed execution and database-backed reliability"
site_url = "https://django-ray.readthedocs.io/en/latest/"
repo_url = "https://github.com/dariuszpanas/django-ray"
repo_name = "GitHub"
edit_uri = "edit/main/docs/"
docs_dir = "docs"
site_dir = "site"
use_directory_urls = true
extra_css = ["stylesheets/extra.css"]

nav = [
  { "Home" = "index.md" },
  { "User Guide" = [
    { "Getting Started" = "getting-started.md" },
    { "Configuration" = "configuration.md" },
    { "Worker Modes" = "worker-modes.md" },
    { "Performance" = "performance.md" },
    { "Observability" = "observability.md" },
    { "Compatibility" = "compatibility.md" },
    { "Compiled Graph Compatibility" = "compiled-graph-compatibility.md" },
    { "Tasks" = "tasks.md" },
    { "Ray-Native Workflows" = "workflows.md" },
    { "Runtime Environments" = "runtime-environments.md" },
    { "Queues" = "queues.md" },
    { "Retry and Error Handling" = "retry.md" },
  ] },
  { "Deployment" = [
    { "Kubernetes" = "deployment/kubernetes.md" },
    { "Docker" = "deployment/docker.md" },
    { "TLS" = "deployment/tls.md" },
    { "Operator Runbook" = "runbook.md" },
  ] },
  { "Reference" = [
    { "CLI" = "reference/cli.md" },
    { "Settings" = "reference/settings.md" },
    { "Durable Input Storage" = "reference/input-storage.md" },
    { "Result Storage" = "reference/result-storage.md" },
    { "Handle Compatibility" = "reference/handle-compatibility.md" },
    { "API" = "reference/api.md" },
  ] },
  { "Architecture Decision Records" = [
    { "ADR-0001: Workflow Plans" = "design/adr-0001-workflow-plan-contract.md" },
    { "ADR-0002: Compiled Sessions" = "design/adr-0002-compiled-session-ownership.md" },
    { "ADR-0003: Invocation Lifecycle" = "design/adr-0003-compiled-invocation-lifecycle.md" },
    { "ADR-0004: Bounded Progress" = "design/adr-0004-bounded-workflow-progress.md" },
  ] },
  { "Development" = [
    { "Contributing" = "contributing.md" },
    { "Architecture" = "architecture.md" },
    { "Workflow Plan Contract" = "workflow-plans.md" },
    { "Ray Serve Boundary" = "design/ray-serve-boundary.md" },
    { "Changelog" = "changelog.md" },
  ] },
]

[project.theme]
logo = "assets/images/django-ray.svg"
favicon = "assets/images/django-ray.svg"
features = [
  "navigation.sections",
  "navigation.path",
  "navigation.top",
  "toc.follow",
  "content.action.edit",
  "content.action.view",
]
