name: YAGA Codex Review Publisher
run-name: >-
  ${{ format('YAGA review wake from {0} run #{1}',
  github.event.workflow_run.name, github.event.workflow_run.run_number) }}

on:
  workflow_run:
    workflows: [CI, "YAGA Review Policy"]
    types: [completed]

permissions: {}

jobs:
  prepare:
    if: >-
      vars.YAGA_CODEX_V2_ENABLED == 'true' &&
      ((github.event.workflow_run.path == '.github/workflows/ci.yml' &&
      github.event.workflow_run.event == 'pull_request') ||
      (github.event.workflow_run.path == '.github/workflows/review-policy.yml' &&
      github.event.workflow_run.event == 'pull_request_target'))
    name: Prepare Codex Review
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
      statuses: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      route: ${{ steps.prepare.outputs.route }}
      pull_request_number: ${{ steps.prepare.outputs.pull_request_number }}
    steps:
      - name: Prepare Codex Review
        id: prepare
        uses: dariuszpanas/yaga@1cd83146d8881049adc00b092904e3ed6892f405
        with:
          gate: codex-review
          operation: prepare
          github-token: ${{ secrets.GITHUB_TOKEN }}
          prerequisite-workflow: .github/workflows/ci.yml
          lifecycle-workflow: .github/workflows/review-policy.yml
          owner-id: ${{ vars.YAGA_CODEX_OWNER_ID }}
          job-timeout-minutes: 15

  observe:
    needs: prepare
    if: >-
      vars.YAGA_CODEX_V2_ENABLED == 'true' &&
      needs.prepare.outputs.route == 'observe'
    name: Observe Codex Review
    concurrency:
      group: >-
        yaga-codex-worker-${{ github.repository_id }}-${{
        needs.prepare.outputs.pull_request_number }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
      statuses: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Observe Codex Review
        uses: dariuszpanas/yaga@1cd83146d8881049adc00b092904e3ed6892f405
        with:
          gate: codex-review
          operation: observe
          github-token: ${{ secrets.GITHUB_TOKEN }}
          prerequisite-workflow: .github/workflows/ci.yml
          lifecycle-workflow: .github/workflows/review-policy.yml
          owner-id: ${{ vars.YAGA_CODEX_OWNER_ID }}
          job-timeout-minutes: 15

  request-owner:
    needs: prepare
    if: >-
      vars.YAGA_CODEX_V2_ENABLED == 'true' &&
      needs.prepare.outputs.route == 'owner'
    name: Request Owner Codex Review
    concurrency:
      group: >-
        yaga-codex-worker-${{ github.repository_id }}-${{
        needs.prepare.outputs.pull_request_number }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: read
      statuses: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Request Owner Codex Review
        uses: dariuszpanas/yaga@1cd83146d8881049adc00b092904e3ed6892f405
        with:
          gate: codex-review
          operation: request
          github-token: ${{ secrets.GITHUB_TOKEN }}
          prerequisite-workflow: .github/workflows/ci.yml
          lifecycle-workflow: .github/workflows/review-policy.yml
          owner-id: ${{ vars.YAGA_CODEX_OWNER_ID }}
          job-timeout-minutes: 15

  authorize-external:
    needs: prepare
    if: >-
      vars.YAGA_CODEX_V2_ENABLED == 'true' &&
      needs.prepare.outputs.route == 'external'
    name: Approve External Codex Review
    concurrency:
      group: >-
        yaga-codex-approval-${{ github.repository_id }}-${{
        needs.prepare.outputs.pull_request_number }}
      cancel-in-progress: true
    environment:
      name: codex-review-approval
      deployment: false
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: read
      statuses: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Record Protected Approval
        uses: dariuszpanas/yaga@1cd83146d8881049adc00b092904e3ed6892f405
        with:
          gate: codex-review
          operation: authorize
          github-token: ${{ secrets.GITHUB_TOKEN }}
          prerequisite-workflow: .github/workflows/ci.yml
          lifecycle-workflow: .github/workflows/review-policy.yml
          owner-id: ${{ vars.YAGA_CODEX_OWNER_ID }}
          approval-marker: ${{ vars.YAGA_CODEX_APPROVAL_MARKER }}
          job-timeout-minutes: 15

  request-external:
    needs: [prepare, authorize-external]
    if: >-
      always() &&
      vars.YAGA_CODEX_V2_ENABLED == 'true' &&
      needs.prepare.result == 'success' &&
      (needs.prepare.outputs.route == 'approved' ||
      (needs.prepare.outputs.route == 'external' &&
      needs.authorize-external.result == 'success'))
    name: Request Approved Codex Review
    concurrency:
      group: >-
        yaga-codex-worker-${{ github.repository_id }}-${{
        needs.prepare.outputs.pull_request_number }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: read
      statuses: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Request Approved Codex Review
        uses: dariuszpanas/yaga@1cd83146d8881049adc00b092904e3ed6892f405
        with:
          gate: codex-review
          operation: request
          github-token: ${{ secrets.GITHUB_TOKEN }}
          prerequisite-workflow: .github/workflows/ci.yml
          lifecycle-workflow: .github/workflows/review-policy.yml
          owner-id: ${{ vars.YAGA_CODEX_OWNER_ID }}
          job-timeout-minutes: 15

  finalize:
    needs: [prepare, observe, request-owner, authorize-external, request-external]
    if: >-
      always() &&
      vars.YAGA_CODEX_V2_ENABLED == 'true' &&
      needs.prepare.result == 'success' &&
      needs.prepare.outputs.route != 'skip'
    name: Finalize Review Policy
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
      statuses: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Finalize Review Policy
        uses: dariuszpanas/yaga@1cd83146d8881049adc00b092904e3ed6892f405
        with:
          gate: codex-review
          operation: finalize
          github-token: ${{ secrets.GITHUB_TOKEN }}
          prerequisite-workflow: .github/workflows/ci.yml
          lifecycle-workflow: .github/workflows/review-policy.yml
          owner-id: ${{ vars.YAGA_CODEX_OWNER_ID }}
          job-timeout-minutes: 15
