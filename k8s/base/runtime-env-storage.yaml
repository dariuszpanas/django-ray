# Shared source bundles for local RuntimeEnv testing.
# Production deployments should normally use immutable HTTPS/S3/GCS archive URIs.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: runtime-env-pvc
  namespace: django-ray
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 256Mi
