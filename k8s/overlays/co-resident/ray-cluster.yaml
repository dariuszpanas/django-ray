apiVersion: ray.io/v1
kind: RayCluster
metadata:
  name: ray
  namespace: django-ray
  labels:
    app: ray
    component: cluster
spec:
  rayVersion: "2.58.0"
  enableInTreeAutoscaling: false
  headGroupSpec:
    serviceType: ClusterIP
    rayStartParams:
      dashboard-host: 0.0.0.0
      dashboard-port: '8265'
      disable-usage-stats: 'true'
      num-cpus: '0'
      object-store-memory: '268435456'
    template:
      metadata:
        labels:
          app: ray
          component: head
      spec:
        containers:
          - name: ray-head
            image: rayproject/ray:2.58.0-py312
            imagePullPolicy: IfNotPresent
            envFrom:
              - configMapRef:
                  name: django-ray-config
            ports:
              - containerPort: 6379
                name: gcs
              - containerPort: 8265
                name: dashboard
              - containerPort: 10001
                name: client
            resources:
              requests:
                cpu: 100m
                memory: 1Gi
              limits:
                cpu: 350m
                memory: 2Gi
            volumeMounts:
              - name: shared-memory
                mountPath: /dev/shm
              - name: runtime-env
                mountPath: /runtime-env
                readOnly: true
              - name: payload-storage
                mountPath: /payload-storage
                readOnly: true
            env:
              - name: DJANGO_SECRET_KEY
                valueFrom:
                  secretKeyRef:
                    name: django-ray-runtime
                    key: DJANGO_SECRET_KEY
              - name: DATABASE_USER
                valueFrom:
                  secretKeyRef:
                    name: django-ray-runtime
                    key: DATABASE_USER
              - name: DATABASE_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: django-ray-runtime
                    key: DATABASE_PASSWORD
              - name: RAY_AUTH_MODE
                value: token
              - name: RAY_AUTH_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: django-ray-auth
                    key: RAY_AUTH_TOKEN
              - name: DJANGO_API_ENABLED
                value: 'false'
        volumes:
          - name: shared-memory
            emptyDir:
              medium: Memory
              sizeLimit: 512Mi
          - name: runtime-env
            persistentVolumeClaim:
              claimName: runtime-env-pvc
          - name: payload-storage
            persistentVolumeClaim:
              claimName: payload-storage-pvc
  workerGroupSpecs:
    - groupName: worker-group
      replicas: 1
      minReplicas: 1
      maxReplicas: 1
      rayStartParams:
        num-cpus: '1'
        object-store-memory: '268435456'
      template:
        metadata:
          labels:
            app: ray
            component: worker
        spec:
          containers:
            - name: ray-worker
              image: rayproject/ray:2.58.0-py312
              imagePullPolicy: IfNotPresent
              envFrom:
                - configMapRef:
                    name: django-ray-config
              resources:
                requests:
                  cpu: 250m
                  memory: 768Mi
                limits:
                  cpu: 500m
                  memory: 1536Mi
              volumeMounts:
                - name: shared-memory
                  mountPath: /dev/shm
                - name: runtime-env
                  mountPath: /runtime-env
                  readOnly: true
                - name: payload-storage
                  mountPath: /payload-storage
                  readOnly: true
              env:
                - name: DJANGO_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: django-ray-runtime
                      key: DJANGO_SECRET_KEY
                - name: DATABASE_USER
                  valueFrom:
                    secretKeyRef:
                      name: django-ray-runtime
                      key: DATABASE_USER
                - name: DATABASE_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: django-ray-runtime
                      key: DATABASE_PASSWORD
                - name: RAY_AUTH_MODE
                  value: token
                - name: RAY_AUTH_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: django-ray-auth
                      key: RAY_AUTH_TOKEN
                - name: DJANGO_API_ENABLED
                  value: 'false'
          volumes:
            - name: shared-memory
              emptyDir:
                medium: Memory
                sizeLimit: 512Mi
            - name: runtime-env
              persistentVolumeClaim:
                claimName: runtime-env-pvc
            - name: payload-storage
              persistentVolumeClaim:
                claimName: payload-storage-pvc
