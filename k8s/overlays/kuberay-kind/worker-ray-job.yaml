apiVersion: apps/v1
kind: Deployment
metadata:
  name: django-ray-worker-ray-job
  namespace: django-ray
  labels:
    app: django-ray
    component: worker
    queues: ray-data
    runner: ray-job
spec:
  replicas: 1
  selector:
    matchLabels:
      app: django-ray
      component: worker
      queues: ray-data
      runner: ray-job
  template:
    metadata:
      labels:
        app: django-ray
        component: worker
        queues: ray-data
        runner: ray-job
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          command:
            - sh
            - -c
            - until nc -z postgres-svc 5432; do echo waiting for postgres; sleep 2; done;
        - name: wait-for-ray-jobs
          image: busybox:1.36
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          command:
            - sh
            - -c
            - until nc -z ray-head-svc 8265; do echo waiting for ray jobs; sleep 2; done;
        - name: wait-for-runtime-env
          image: busybox:1.36
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          command:
            - sh
            - -c
            - until test -f /runtime-env/django-ray-source.zip; do echo waiting for runtime env; sleep
              2; done;
          volumeMounts:
            - name: runtime-env
              mountPath: /runtime-env
              readOnly: true
      containers:
        - name: django-ray-worker
          image: django-ray:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          command:
            - python
            - testproject/manage.py
            - django_ray_worker
          args:
            - --queue
            - ray-data
            - --concurrency
            - '1'
          envFrom:
            - configMapRef:
                name: django-ray-config
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: 500m
          volumeMounts:
            - name: runtime-env
              mountPath: /runtime-env
              readOnly: true
            - name: payload-storage
              mountPath: /payload-storage
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - >-
                  exec python testproject/manage.py django_ray_worker_ready
                  --queue ray-data
                  --hostname "$DJANGO_RAY_POD_NAME" --json
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - >-
                  test -r /proc/1/stat &&
                  awk '{exit ($3=="Z"||$3=="X")?1:0}' /proc/1/stat &&
                  tr '\0' ' ' < /proc/1/cmdline | grep -q django_ray_worker
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          env:
            - name: DJANGO_RAY_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: DJANGO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: django-ray-runtime
                  key: DJANGO_SECRET_KEY
            - name: DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: django-ray-runtime
                  key: DATABASE_USER
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: django-ray-runtime
                  key: DATABASE_PASSWORD
            - name: RAY_AUTH_MODE
              value: token
            - name: RAY_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: django-ray-auth
                  key: RAY_AUTH_TOKEN
            - name: DJANGO_API_ENABLED
              value: 'false'
      volumes:
        - name: runtime-env
          persistentVolumeClaim:
            claimName: runtime-env-pvc
        - name: payload-storage
          persistentVolumeClaim:
            claimName: payload-storage-pvc
