name: Commit Messages

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  # Keep stale event heads from cancelling the current-head proof.
  group: commit-messages-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  conventional-commits:
    name: Commit Messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install commit policy
        run: npm ci --ignore-scripts

      - name: Validate PR title
        if: >-
          !(
            github.event.pull_request.user.login == 'dependabot[bot]' &&
            github.event.pull_request.head.repo.full_name == github.repository &&
            startsWith(github.event.pull_request.head.ref, 'dependabot/')
          )
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: make commit-title-check

      - name: Fetch and verify PR commits
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          pr_ref="refs/remotes/pull/${PR_NUMBER}/head"
          git fetch --no-tags --force origin \
            "refs/pull/${PR_NUMBER}/head:${pr_ref}"

          fetched_head="$(git rev-parse "$pr_ref")"
          if [ "$fetched_head" != "$PR_HEAD_SHA" ]; then
            echo "Fetched PR head does not match the event head SHA." >&2
            exit 1
          fi
          git cat-file -e "${PR_BASE_SHA}^{commit}"

      - name: Validate ordinary PR commits
        if: >-
          !(
            github.event.pull_request.user.login == 'dependabot[bot]' &&
            github.event.pull_request.head.repo.full_name == github.repository &&
            startsWith(github.event.pull_request.head.ref, 'dependabot/')
          )
        env:
          COMMIT_BASE: ${{ github.event.pull_request.base.sha }}
          COMMIT_HEAD: refs/remotes/pull/${{ github.event.pull_request.number }}/head
        run: make commit-check
