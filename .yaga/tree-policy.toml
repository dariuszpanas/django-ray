tree-policy-version = 1
required-paths = [
  "AGENTS.md", "CONTRIBUTING.md", "LICENSE", "README.md", "SECURITY.md",
  "pyproject.toml", "uv.lock", ".yaga.toml", ".githooks/commit-msg",
  ".yaga/checks/repository.toml", ".yaga/checks/workflows.toml",
  ".yaga/branch-policy.toml", ".yaga/change-policy.toml",
  ".yaga/mode-policy.toml", ".yaga/path-policy.toml",
  ".yaga/size-policy.toml", ".yaga/tree-policy.toml",
]
forbidden-patterns = [
  "**/.env", "**/__pycache__/**", "**/.mypy_cache/**",
  "**/.pytest_cache/**", "**/.ruff_cache/**", "**/.tox/**",
  "**/.venv/**", "**/*.pyc", "**/*.pyo", "build/**", "dist/**",
  "htmlcov/**", "**/.coverage",
]
