name: Pull Request Review Wake
run-name: >-
  YAGA review wake for #${{ github.event.issue.number || inputs.pull_request || '0' }}

on:
  issue_comment:
    types: [created, edited]
  workflow_dispatch:
    inputs:
      pull_request:
        description: Open pull request number to evaluate and review
        required: true
        type: number

permissions: {}

jobs:
  wake:
    name: Wake Pull Request Review Publisher
    if: >-
      (
        github.event_name == 'workflow_dispatch' &&
        github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      ) ||
      (
        github.event_name == 'issue_comment' &&
        github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
        github.event.issue.pull_request != null &&
        github.event.issue.state == 'open' &&
        github.event.issue.user.login != 'github-actions[bot]' &&
        (
          github.event.issue.user.login != 'dependabot[bot]' ||
          github.event.issue.user.type != 'Bot'
        ) &&
        github.event.comment.user.type == 'Bot' &&
        github.event.comment.user.login != 'github-actions[bot]' &&
        !contains(github.event.comment.body, '"status":"running"') &&
        !contains(github.event.comment.body, '"status": "running"')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Validate pull-request wake target
        env:
          YAGA_PR_NUMBER: ${{ github.event.issue.number || inputs.pull_request }}
        run: |
          set -euo pipefail
          [[ "$YAGA_PR_NUMBER" =~ ^[1-9][0-9]{0,18}$ ]]
