apiVersion: apps/v1
kind: Deployment
metadata:
  name: django-ray-worker-ml
  namespace: django-ray
  labels:
    app: django-ray
    component: worker
    queues: ml
spec:
  replicas: 1
  selector:
    matchLabels:
      app: django-ray
      component: worker
      queues: ml
  template:
    metadata:
      labels:
        app: django-ray
        component: worker
        queues: ml
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z postgres-svc 5432; do echo waiting for postgres; sleep 2; done;"]
        - name: wait-for-ray
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z ray-head-svc 10001; do echo waiting for ray-head; sleep 2; done;"]
      containers:
        - name: django-ray-worker
          image: django-ray:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "testproject/manage.py", "django_ray_worker"]
          args:
            - "--queue"
            - "ml"
            - "--cluster"
            - "ray://ray-head-svc:10001"
            - "--concurrency"
            - "20"
          envFrom:
            - configMapRef:
                name: django-ray-config
            - secretRef:
                name: django-ray-secret
          env:
            - name: RAY_ADDRESS
              value: "ray://ray-head-svc:10001"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "test -d /proc/1 && grep -q python /proc/1/cmdline"
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "test -d /proc/1 && grep -q python /proc/1/cmdline"
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
