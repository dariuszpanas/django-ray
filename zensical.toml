[project]
site_name = "django-ray"
site_description = "Ray-based backend for Django Tasks with distributed execution and database-backed reliability"
site_url = "https://django-ray.readthedocs.io/en/latest/"
repo_url = "https://github.com/dariuszpanas/django-ray"
repo_name = "GitHub"
edit_uri = "edit/main/docs/"
docs_dir = "docs"
site_dir = "site"
use_directory_urls = true
extra_css = ["stylesheets/extra.css"]

nav = [
  { "Home" = "README.md" },
  { "Getting Started" = [
    { "Quick Start" = "getting-started.md" },
    { "Tasks" = "tasks.md" },
    { "Queues" = "queues.md" },
    { "Retry and Error Handling" = "retry.md" },
    { "Configuration" = "configuration.md" },
  ] },
  { "Execution & Workflows" = [
    { "Worker Modes" = "worker-modes.md" },
    { "Ray-Native Workflows" = "workflows.md" },
    { "Runtime Environments" = "runtime-environments.md" },
    { "Ray Data Batch Jobs" = "ray-data.md" },
  ] },
  { "Operations & Observability" = [
    { "Operator Runbook" = "runbook.md" },
    { "Observability" = "observability.md" },
    { "Performance" = "performance.md" },
    { "Upgrade Guides" = [
      { "Upgrade from 0.7.1" = "deployment/upgrading-from-0.7.md" },
      { "Upgrade from 0.6" = "deployment/upgrading-from-0.6.md" },
      { "Upgrade from 0.5" = "deployment/upgrading-from-0.5.md" },
      { "Upgrade to 0.5" = "deployment/upgrading-0.5.md" },
    ] },
  ] },
  { "Migration & Ecosystem" = [
    { "Migrating from Celery" = "celery-migration.md" },
    { "Ray Ecosystem Support" = "ray-ecosystem.md" },
    { "Django to Private Ray Serve" = "ray-serve-gateway.md" },
    { "Compatibility" = "compatibility.md" },
    { "Stability and Deprecation" = "stability.md" },
  ] },
  { "Deployment" = [
    { "Docker" = "deployment/docker.md" },
    { "Kubernetes" = "deployment/kubernetes.md" },
    { "TLS" = "deployment/tls.md" },
    { "Local Credentials" = "deployment/local-credentials.md" },
  ] },
  { "Reference" = [
    { "CLI" = "reference/cli.md" },
    { "Bounded Doctor" = "reference/doctor.md" },
    { "Settings" = "reference/settings.md" },
    { "Durable Input Storage" = "reference/input-storage.md" },
    { "Result Storage" = "reference/result-storage.md" },
    { "Handle Compatibility" = "reference/handle-compatibility.md" },
    { "API" = "reference/api.md" },
    { "Changelog" = "changelog.md" },
  ] },
  { "Development" = [
    { "Architecture" = "architecture.md" },
    { "Workflow Plan Contract" = "workflow-plans.md" },
    { "Compiled Graph Compatibility" = "compiled-graph-compatibility.md" },
    { "1.0 Readiness" = "one-zero-readiness.md" },
    { "Ray Serve Boundary" = "design/ray-serve-boundary.md" },
    { "Contributing" = "contributing.md" },
    { "Testing & Qualification" = [
      { "Local KubeRay Final Gate" = "deployment/local-kuberay-gate.md" },
      { "Test Suite Taxonomy" = "testing/test-suite-taxonomy.md" },
      { "Finite Linux Test Stages" = "testing/linux-test-plan.md" },
      { "Proposed Soak Certification" = "testing/soak-certification.md" },
      { "Application Witness Binding" = "testing/application-witness-binding.md" },
      { "Maintenance Query Plans" = "testing/maintenance-query-plans.md" },
      { "Test Suite Baseline" = "investigations/test-suite-baseline-2026-07-22.md" },
    ] },
  ] },
]

[project.theme]
logo = "assets/images/django-ray.svg"
favicon = "assets/images/django-ray.svg"
features = [
  "navigation.sections",
  "navigation.path",
  "navigation.top",
  "toc.follow",
  "content.code.copy",
  "content.action.edit",
  "content.action.view",
  "search.suggest",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"
