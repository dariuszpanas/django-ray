name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      xdist_benchmark_mode:
        description: Optional bounded xdist evidence action
        type: choice
        options:
          - "off"
          - pair
          - aggregate
        default: "off"
      xdist_benchmark_sample:
        description: Unique sample label for pair mode
        type: string
        default: ""
      xdist_benchmark_order:
        description: Same-runner execution order for pair mode
        type: choice
        options:
          - serial-xdist
          - xdist-serial
        default: serial-xdist
      xdist_benchmark_pair_run_ids:
        description: Three comma-separated pair workflow run IDs for aggregate mode
        type: string
        default: ""

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    if: github.event_name != 'pull_request_target'
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "latest"
          enable-cache: "false"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Check linting
        run: uv run ruff check .

  docs:
    if: github.event_name != 'pull_request_target'
    name: Docs Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "latest"
          enable-cache: "false"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Build docs
        run: make docs-build-strict

  typecheck:
    if: github.event_name != 'pull_request_target'
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "latest"
          enable-cache: "false"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Type check
        run: uv run ty check

  test:
    if: github.event_name != 'pull_request_target'
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    env:
      COVERAGE_GLOBAL_MIN: "95"
      COVERAGE_WORKER_MIN: "90"
      COVERAGE_RAY_JOB_MIN: "90"
      DJANGO_RAY_REQUIRE_KUSTOMIZE_PROBE_TESTS: "1"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "latest"
          enable-cache: "false"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen --python ${{ matrix.python-version }}

      - name: Run tests with suite timing
        if: matrix.python-version == '3.12'
        run: >-
          uv run --python ${{ matrix.python-version }} python
          scripts/test_suite_inventory.py run
          --lane supported-python
          --observation github-actions-ubuntu-py312
          --variant locked-dependencies
          --timing-output artifacts/test-suite-inventory/github-actions-py312.json
          --external-note "GitHub Actions queue and environment setup are recorded by workflow metadata; this record starts at pytest instrumentation"
          --
          --cov=src
          --cov-report=xml
          --cov-report=term
          --cov-fail-under=${{ env.COVERAGE_GLOBAL_MIN }}
          -v

      - name: Validate suite timing evidence
        if: matrix.python-version == '3.12'
        run: >-
          uv run --python ${{ matrix.python-version }} python
          scripts/test_suite_inventory.py collect
          --timing artifacts/test-suite-inventory/github-actions-py312.json
          --json-output artifacts/test-suite-inventory/github-actions-py312-inventory.json
          --markdown-output artifacts/test-suite-inventory/github-actions-py312-inventory.md

      - name: Upload suite timing evidence
        if: always() && matrix.python-version == '3.12'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-suite-timing-python-3.12
          path: artifacts/test-suite-inventory/
          if-no-files-found: warn
          retention-days: 14

      - name: Run tests
        if: matrix.python-version != '3.12'
        run: uv run --python ${{ matrix.python-version }} pytest -m "not live_cluster" --cov=src --cov-report=xml --cov-report=term --cov-fail-under=${{ env.COVERAGE_GLOBAL_MIN }} -v

      - name: Enforce worker module coverage
        if: matrix.python-version == '3.12'
        run: uv run coverage report --include="src/django_ray/management/commands/django_ray_worker.py" --fail-under=${{ env.COVERAGE_WORKER_MIN }}

      - name: Enforce ray job module coverage
        if: matrix.python-version == '3.12'
        run: uv run coverage report --include="src/django_ray/runner/ray_job.py" --fail-under=${{ env.COVERAGE_RAY_JOB_MIN }}

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  postgresql-coordination:
    if: github.event_name != 'pull_request_target'
    name: PostgreSQL Coordination & Polling
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DJANGO_SETTINGS_MODULE: tests.postgres_settings
      DATABASE_NAME: django_ray
      DATABASE_TEST_NAME: test_django_ray
      DATABASE_USER: django_ray
      DATABASE_PASSWORD: django_ray
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: "5432"
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: django_ray
          POSTGRES_USER: django_ray
          POSTGRES_PASSWORD: django_ray
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U django_ray -d django_ray"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "latest"
          enable-cache: "false"

      - name: Set up minimum supported Python
        run: uv python install 3.12

      - name: Install dependencies with PostgreSQL support
        run: |
          uv sync --frozen --extra postgres --python 3.12
          uv pip install --python .venv/bin/python "django==6.0"

      - name: Report database test versions
        run: >-
          uv run --no-sync --python 3.12 python -c
          "import django, psycopg, sys; print(sys.version); print('Django', django.get_version()); print('psycopg', psycopg.__version__)"

      - name: Run PostgreSQL coordination and polling tests
        run: uv run --no-sync --python 3.12 make test-postgres

      - name: Show PostgreSQL diagnostics
        if: failure()
        run: |
          uv run --no-sync --python 3.12 python - <<'PY'
          import os
          import psycopg

          try:
              with psycopg.connect(
                  dbname=os.environ["DATABASE_NAME"],
                  user=os.environ["DATABASE_USER"],
                  password=os.environ["DATABASE_PASSWORD"],
                  host=os.environ["DATABASE_HOST"],
                  port=os.environ["DATABASE_PORT"],
              ) as connection:
                  with connection.cursor() as cursor:
                      cursor.execute("SELECT version(), current_database()")
                      print("PostgreSQL:", cursor.fetchone())
                      cursor.execute(
                          """
                          SELECT pid, state, wait_event_type, wait_event, left(query, 200)
                          FROM pg_stat_activity
                          WHERE datname = current_database()
                          ORDER BY pid
                          """
                      )
                      for activity in cursor.fetchall():
                          print("activity:", activity)
          except Exception as exc:
              print(f"PostgreSQL diagnostic connection failed: {type(exc).__name__}: {exc}")
              raise
          PY

  live-cluster:
    if: github.event_name != 'pull_request_target'
    name: Live Cluster Fault Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DJANGO_RAY_LIVE_CLUSTER_TESTS: "1"
      DJANGO_RAY_LIVE_RAY_ADDRESS: ray://127.0.0.1:10001
      DJANGO_RAY_LIVE_MIN_NODES: "2"
      DJANGO_RAY_LIVE_WORKING_DIR_URI: file:///tmp/django-ray-source.zip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Start a two-node Ray cluster
        run: |
          docker network create django-ray-live-cluster
          docker run --detach --name ray-head \
            --network django-ray-live-cluster \
            --shm-size=1g \
            --publish 127.0.0.1:10001:10001 \
            rayproject/ray:2.56.0-py312 \
            bash -lc 'ray start --head --port=6379 \
              --ray-client-server-port=10001 --num-cpus=0 \
              --disable-usage-stats --block'
          docker run --detach --name ray-worker \
            --network django-ray-live-cluster \
            --shm-size=1g \
            rayproject/ray:2.56.0-py312 \
            bash -lc 'ray start --address=ray-head:6379 --num-cpus=1 \
              --disable-usage-stats --block'

      - name: Wait for two live Ray nodes
        run: |
          for attempt in $(seq 1 60); do
            live_nodes="$(docker exec ray-head python -c 'import logging; import ray; ray.init(address="ray-head:6379", logging_level=logging.ERROR); print(sum(node["Alive"] for node in ray.nodes()))' 2>/dev/null || true)"
            if [[ "$live_nodes" =~ ^[0-9]+$ && "$live_nodes" -ge 2 ]]; then
              echo "Ray cluster is ready with $live_nodes live nodes."
              exit 0
            fi
            echo "Waiting for two live Ray nodes (attempt $attempt/60; observed ${live_nodes:-0})."
            sleep 2
          done
          docker logs ray-head
          docker logs ray-worker
          exit 1

      - name: Stage the project RuntimeEnv on Ray nodes
        run: |
          git archive --format=zip --output=/tmp/django-ray-source.zip HEAD
          docker cp /tmp/django-ray-source.zip ray-head:/tmp/django-ray-source.zip
          docker cp /tmp/django-ray-source.zip ray-worker:/tmp/django-ray-source.zip
          docker exec ray-head python -c "import importlib.util; assert importlib.util.find_spec('django_ray') is None"
          docker exec ray-worker python -c "import importlib.util; assert importlib.util.find_spec('django_ray') is None"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "latest"
          enable-cache: "false"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run live cluster fault tests
        run: uv run pytest tests/integration/test_live_failure_injection.py -m live_cluster -v

      - name: Show Ray container logs
        if: always()
        run: |
          docker logs ray-head || true
          docker logs ray-worker || true

      - name: Remove Ray containers
        if: always()
        run: |
          docker rm --force ray-worker ray-head || true
          docker network rm django-ray-live-cluster || true

  testproject:
    name: Testproject Smoke
    runs-on: ubuntu-latest
    env:
      COVERAGE_TESTPROJECT_MIN: "80"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "latest"
          enable-cache: "false"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Validate sample project
        run: uv run make test-testproject

  docker-compose-smoke:
    if: github.event_name != 'pull_request_target'
    name: Docker Compose Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate disposable credentials
        shell: bash
        run: |
          api_token="$(openssl rand -hex 32)"
          postgres_password="$(openssl rand -hex 32)"
          echo "::add-mask::$api_token"
          echo "::add-mask::$postgres_password"
          {
            printf 'DJANGO_API_TOKEN=%s\n' "$api_token"
            printf 'POSTGRES_PASSWORD=%s\n' "$postgres_password"
          } >> "$GITHUB_ENV"

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Start migrated web and worker services
        run: docker compose up --build --detach web worker

      - name: Run bounded authenticated task smoke
        run: docker compose --profile smoke run --rm --no-deps smoke

      - name: Show bounded Compose diagnostics
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --no-color --tail=200 postgres migrate web worker |
            python3 scripts/bounded_redact.py \
              --max-chars 65536 \
              --secret-env DJANGO_API_TOKEN \
              --secret-env POSTGRES_PASSWORD

      - name: Remove Compose resources
        if: always()
        run: docker compose --profile smoke down --volumes --remove-orphans

  dependency-compatibility:
    if: github.event_name != 'pull_request_target'
    name: Dependencies (${{ matrix.resolution }}, Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - resolution: minimum-direct
            python-version: "3.12"
          - resolution: latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "latest"
          enable-cache: "false"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install minimum supported dependencies
        if: matrix.resolution == 'minimum-direct'
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install --python .venv/bin/python \
            -e . \
            "django==6.0" \
            "ray[default]==2.53.0" \
            "django-ninja==1.5.1" \
            "whitenoise==6.6" \
            "pytest==7.0" \
            "pytest-django==4.7" \
            "pytest-cov==4.0" \
            "pytest-xdist==3.8.0"

      - name: Resolve and install latest dependencies
        if: matrix.resolution == 'latest'
        run: |
          uv lock --upgrade --python ${{ matrix.python-version }}
          uv sync --python ${{ matrix.python-version }}

      - name: Run tests
        run: >-
          uv run --no-sync --python ${{ matrix.python-version }}
          pytest -m "not live_cluster and not real_ray" -q

  pytest-xdist-benchmark-pair:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.xdist_benchmark_mode == 'pair'
    name: Optional pytest-xdist paired benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COVERAGE_GLOBAL_MIN: "95"
      COVERAGE_WORKER_MIN: "90"
      COVERAGE_RAY_JOB_MIN: "90"
      DJANGO_RAY_REQUIRE_KUSTOMIZE_PROBE_TESTS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.9.18"
          enable-cache: "false"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install locked dependencies
        run: uv sync --frozen --python 3.12

      - name: Run same-SHA canonical pair
        shell: bash
        env:
          BENCHMARK_SAMPLE: ${{ inputs.xdist_benchmark_sample }}
          BENCHMARK_ORDER: ${{ inputs.xdist_benchmark_order }}
        run: |
          if [[ -z "$BENCHMARK_SAMPLE" ]]; then
            echo "xdist_benchmark_sample must be non-empty in pair mode" >&2
            exit 2
          fi
          case "$BENCHMARK_ORDER" in
            serial-xdist) executions=(serial xdist) ;;
            xdist-serial) executions=(xdist serial) ;;
            *) echo "unsupported pair order: $BENCHMARK_ORDER" >&2; exit 2 ;;
          esac
          ray_aliases=()
          cleanup_ray_aliases() {
            status=$?
            for ray_alias in "${ray_aliases[@]}"; do
              if [[ -L "$ray_alias" ]]; then
                unlink -- "$ray_alias" || status=2
              elif [[ -e "$ray_alias" ]]; then
                echo "refusing to remove non-symlink Ray alias: $ray_alias" >&2
                status=2
              fi
            done
            exit "$status"
          }
          trap cleanup_ray_aliases EXIT
          pair_root="artifacts/pytest-xdist-benchmark/${GITHUB_RUN_ID}"
          for execution in "${executions[@]}"; do
            output="${pair_root}/${execution}"
            case "$execution" in
              serial) ray_alias="/tmp/drs" ;;
              xdist) ray_alias="/tmp/drx" ;;
            esac
            if [[ -e "$ray_alias" || -L "$ray_alias" ]]; then
              echo "Ray alias must start absent: $ray_alias" >&2
              exit 2
            fi
            mkdir -p "$output"
            ln -s "$PWD/$output" "$ray_alias"
            ray_aliases+=("$ray_alias")
            started_ns="$(date +%s%N)"
            echo "::group::Canonical ${execution} execution"
            uv run --python 3.12 make test-cov-phased \
              TEST_SUITE_PHASED_OUTPUT_DIR="${output}" \
              TEST_SUITE_RAY_TMP_DIR="${ray_alias}/ray-tmp" \
              TEST_SUITE_HERMETIC_EXECUTION="${execution}" \
              TEST_SUITE_OBSERVATION="github-actions-${GITHUB_RUN_ID}-${execution}" \
              TEST_SUITE_VARIANT="locked-${BENCHMARK_ORDER}" \
              TEST_SUITE_EXTERNAL_NOTE="Workflow queue and environment setup are recorded separately from pytest and canonical-plan timing."
            finished_ns="$(date +%s%N)"
            uv run --python 3.12 python scripts/test_suite_benchmark.py record-run \
              --execution "$execution" \
              --started-ns "$started_ns" \
              --finished-ns "$finished_ns" \
              --repository "$GITHUB_REPOSITORY" \
              --sha "$GITHUB_SHA" \
              --tree-sha "$(git rev-parse 'HEAD^{tree}')" \
              --run-id "$GITHUB_RUN_ID" \
              --run-attempt "$GITHUB_RUN_ATTEMPT" \
              --job "$GITHUB_JOB" \
              --runner-os "$RUNNER_OS" \
              --runner-image-os "$ImageOS" \
              --runner-image-version "$ImageVersion" \
              --output "${output}/run.json"
            echo "::endgroup::"
          done
          uv run --python 3.12 python scripts/test_suite_benchmark.py compare \
            --serial-dir "${pair_root}/serial" \
            --xdist-dir "${pair_root}/xdist" \
            --sample "$BENCHMARK_SAMPLE" \
            --order "$BENCHMARK_ORDER" \
            --json-output "${pair_root}/pair.json" \
            --markdown-output "${pair_root}/pair.md"

      - name: Add pair summary
        if: always()
        run: |
          summary="artifacts/pytest-xdist-benchmark/${GITHUB_RUN_ID}/pair.md"
          if [ -f "$summary" ]; then
            cat "$summary" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Paired benchmark evidence was not produced." >> "$GITHUB_STEP_SUMMARY"
          fi
          for execution in serial xdist; do
            residue="artifacts/pytest-xdist-benchmark/${GITHUB_RUN_ID}/${execution}/ray-residue.json"
            if [ -f "$residue" ]; then
              {
                echo "### ${execution} Ray cleanup evidence"
                echo '```json'
                cat "$residue"
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Upload paired benchmark evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pytest-xdist-pair-${{ github.run_id }}
          path: |
            artifacts/pytest-xdist-benchmark/${{ github.run_id }}/pair.json
            artifacts/pytest-xdist-benchmark/${{ github.run_id }}/pair.md
            artifacts/pytest-xdist-benchmark/${{ github.run_id }}/serial/*.json
            artifacts/pytest-xdist-benchmark/${{ github.run_id }}/serial/*.xml
            artifacts/pytest-xdist-benchmark/${{ github.run_id }}/serial/*.md
            artifacts/pytest-xdist-benchmark/${{ github.run_id }}/xdist/*.json
            artifacts/pytest-xdist-benchmark/${{ github.run_id }}/xdist/*.xml
            artifacts/pytest-xdist-benchmark/${{ github.run_id }}/xdist/*.md
            !artifacts/pytest-xdist-benchmark/${{ github.run_id }}/**/ray-tmp/**
            !artifacts/pytest-xdist-benchmark/${{ github.run_id }}/**/.coverage*
          if-no-files-found: warn
          retention-days: 14

  pytest-xdist-benchmark-aggregate:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.xdist_benchmark_mode == 'aggregate'
    name: Optional pytest-xdist retention decision
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.9.18"
          enable-cache: "false"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install locked dependencies
        run: uv sync --frozen --python 3.12

      - name: Download three distinct pair runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PAIR_RUN_IDS: ${{ inputs.xdist_benchmark_pair_run_ids }}
        run: |
          mapfile -t run_ids < <(printf '%s' "$PAIR_RUN_IDS" | tr ', ' '\n\n' | sed '/^$/d')
          if [[ "${#run_ids[@]}" -ne 3 ]]; then
            echo "aggregate mode requires exactly three pair workflow run IDs" >&2
            exit 2
          fi
          if [[ "$(printf '%s\n' "${run_ids[@]}" | sort -u | wc -l)" -ne 3 ]]; then
            echo "pair workflow run IDs must be distinct" >&2
            exit 2
          fi
          for run_id in "${run_ids[@]}"; do
            if [[ ! "$run_id" =~ ^[0-9]+$ ]]; then
              echo "invalid pair workflow run ID: $run_id" >&2
              exit 2
            fi
            gh run download "$run_id" \
              --repo "$GITHUB_REPOSITORY" \
              --name "pytest-xdist-pair-${run_id}" \
              --dir "artifacts/pytest-xdist-pairs/${run_id}"
          done

      - name: Aggregate retention evidence
        shell: bash
        run: |
          pair_arguments=()
          for pair in artifacts/pytest-xdist-pairs/*/pair.json; do
            pair_arguments+=(--pair "$pair")
          done
          uv run --python 3.12 python scripts/test_suite_benchmark.py aggregate \
            "${pair_arguments[@]}" \
            --repository "$GITHUB_REPOSITORY" \
            --sha "$GITHUB_SHA" \
            --tree-sha "$(git rev-parse 'HEAD^{tree}')" \
            --json-output artifacts/pytest-xdist-retention.json \
            --markdown-output artifacts/pytest-xdist-retention.md \
            --require-retention

      - name: Add retention summary
        if: always()
        run: |
          if [ -f artifacts/pytest-xdist-retention.md ]; then
            cat artifacts/pytest-xdist-retention.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Retention evidence was not produced." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload retention evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pytest-xdist-retention-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/pytest-xdist-retention.json
            artifacts/pytest-xdist-retention.md
          if-no-files-found: warn
          retention-days: 14

  build:
    if: github.event_name != 'pull_request_target'
    name: Build Package
    runs-on: ubuntu-latest
    needs:
      [
        lint,
        docs,
        typecheck,
        test,
        postgresql-coordination,
        live-cluster,
        testproject,
        docker-compose-smoke,
        dependency-compatibility,
      ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "latest"
          enable-cache: "false"

      - name: Set up Python
        run: uv python install 3.12

      - name: Build package
        run: uv build

      - name: Verify installed wheel and migrations
        run: |
          wheel="$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)"
          test -n "$wheel"
          uv run --isolated --no-project --python 3.12 \
            --with "$wheel" \
            python scripts/verify_wheel.py --version "$(uv version --short)"

      - name: Upload dist artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  ci-gate:
    name: CI Gate
    if: always()
    needs:
      - lint
      - docs
      - typecheck
      - test
      - postgresql-coordination
      - live-cluster
      - testproject
      - docker-compose-smoke
      - dependency-compatibility
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Require every blocking CI job to succeed
        env:
          BLOCKING_JOB_RESULTS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os

          results = {
              job_id: details["result"]
              for job_id, details in json.loads(
                  os.environ["BLOCKING_JOB_RESULTS_JSON"]
              ).items()
          }
          if not results:
              raise SystemExit("CI Gate blocked: no blocking job results")

          expected_jobs = {
              "build",
              "dependency-compatibility",
              "docs",
              "docker-compose-smoke",
              "lint",
              "live-cluster",
              "postgresql-coordination",
              "test",
              "testproject",
              "typecheck",
          }
          received_jobs = set(results)
          if received_jobs != expected_jobs:
              missing = ",".join(sorted(expected_jobs - received_jobs)) or "-"
              unexpected = ",".join(sorted(received_jobs - expected_jobs)) or "-"
              raise SystemExit(
                  "CI Gate blocked: result jobs mismatch; "
                  f"missing={missing}; unexpected={unexpected}"
              )

          for job_id, result in sorted(results.items()):
              print(f"{job_id}: {result}")

          unsuccessful = [
              f"{job_id}={result}"
              for job_id, result in sorted(results.items())
              if result != "success"
          ]
          if unsuccessful:
              raise SystemExit(
                  "CI Gate blocked: " + ", ".join(unsuccessful)
              )
          PY

