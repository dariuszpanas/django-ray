namespace: django-ray
name: fanout-real-ray-kubernetes-qualification
description: Verify installed-wheel fanout and strict rejection with exact per-test execution evidence.
revision: v1
schema_version: 1

definition:
  executor:
    kind: command
    payload:
      argv: [python, -m, qualification.runtime.scenario]
  requirements:
    capabilities: [external-evidence-v1, kubernetes, linux, python, ray]
  timeout_seconds: 420
  evidence:
    max_artifacts: 3
    max_bytes_per_artifact: 1048576
    max_total_bytes: 3145728
    required_kinds: [junit, log, manifest]
  cleanup:
    policy: always
    timeout_seconds: 180
