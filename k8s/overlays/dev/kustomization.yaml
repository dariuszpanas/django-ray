# Local evaluation only; credentials are prepared separately.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: django-ray
resources:
  - ../../base
  - worker-all-queues.yaml
  - worker-ml.yaml
patches:
  - patch: |
      - op: replace
        path: /data/DJANGO_DEPLOYMENT_MODE
        value: demo
    target:
      kind: ConfigMap
      name: django-ray-config
  - patch: |
      - op: replace
        path: /data/DJANGO_ALLOWED_HOSTS
        value: localhost,127.0.0.1,django-ray.localhost,django-web-svc
    target:
      kind: ConfigMap
      name: django-ray-config
  - patch: |
      - op: replace
        path: /spec/template/spec/containers/0/readinessProbe/httpGet/httpHeaders/0/value
        value: django-ray.localhost
      - op: replace
        path: /spec/template/spec/containers/0/livenessProbe/httpGet/httpHeaders/0/value
        value: django-ray.localhost
    target:
      kind: Deployment
      name: django-web
  - patch: |
      - op: replace
        path: /data/DJANGO_DEBUG
        value: 'True'
    target:
      kind: ConfigMap
      name: django-ray-config
  - patch: |
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 128Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 50m
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 256Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: 250m
    target:
      kind: Deployment
      name: django-ray-worker
  - patch: |
      - op: replace
        path: /spec/template/spec/containers/0/env
        value:
          - name: RAY_ADDRESS
            value: ray://ray-head-svc:10001
          - name: DJANGO_RAY_QUEUES
            value: default,high-priority,low-priority
          - name: DJANGO_RAY_CONCURRENCY
            value: '40'
          - name: DJANGO_SECRET_KEY
            valueFrom:
              secretKeyRef:
                name: django-ray-runtime
                key: DJANGO_SECRET_KEY
          - name: DATABASE_USER
            valueFrom:
              secretKeyRef:
                name: django-ray-runtime
                key: DATABASE_USER
          - name: DATABASE_PASSWORD
            valueFrom:
              secretKeyRef:
                name: django-ray-runtime
                key: DATABASE_PASSWORD
          - name: RAY_AUTH_MODE
            value: token
          - name: RAY_AUTH_TOKEN
            valueFrom:
              secretKeyRef:
                name: django-ray-auth
                key: RAY_AUTH_TOKEN
          - name: DJANGO_API_ENABLED
            value: 'false'
    target:
      kind: Deployment
      name: django-ray-worker
