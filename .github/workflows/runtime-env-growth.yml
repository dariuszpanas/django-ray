name: RuntimeEnv Growth Investigation

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/runtime-env-growth.yml
      - benchmarks/runtime-env-growth/**
      - scripts/benchmark_runtime_env_growth.py
      - scripts/runtime_env_growth/**
      - scripts/investigate_pytest_shutdown.py
      - scripts/observe_pytest_exit.py
      - scripts/coverage_debt.py
      - scripts/require_linux.py
      - tests/real_ray_ownership.py
      - tests/unit/test_runtime_env_growth*.py
      - src/django_ray/runtime/runtime_env.py
      - src/django_ray/workflow/plans.py
      - pyproject.toml
      - uv.lock

permissions:
  contents: read

concurrency:
  group: runtime-env-growth-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  investigate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: latest
          enable-cache: "false"
      - name: Install locked test tooling
        timeout-minutes: 3
        run: uv sync --frozen --python 3.13
      - name: Check evidence and Linux process ownership
        timeout-minutes: 2
        run: uv run --no-sync --python 3.13 pytest tests/unit/test_runtime_env_growth.py tests/unit/test_runtime_env_growth_process.py -q --no-cov
      - name: Run fixed bounded attribution experiment
        timeout-minutes: 28
        run: uv run --no-sync --python 3.13 python scripts/benchmark_runtime_env_growth.py
      - name: Retain bounded evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-env-growth-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/runtime-env-growth/report.json
          if-no-files-found: warn
          retention-days: 14
