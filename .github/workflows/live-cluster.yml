name: Live Cluster Tests

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/live-cluster.yml"
      - "pyproject.toml"
      - "uv.lock"
      - "src/django_ray/**"
      - "tests/integration/test_live_failure_injection.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/live-cluster.yml"
      - "pyproject.toml"
      - "uv.lock"
      - "src/django_ray/**"
      - "tests/integration/test_live_failure_injection.py"
  workflow_dispatch:

concurrency:
  group: live-cluster-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-cluster:
    name: Live Cluster Fault Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DJANGO_RAY_LIVE_CLUSTER_TESTS: "1"
      DJANGO_RAY_LIVE_RAY_ADDRESS: ray://127.0.0.1:10001
      DJANGO_RAY_LIVE_MIN_NODES: "2"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Start a two-node Ray cluster
        run: |
          docker network create django-ray-live-cluster
          docker run --detach --name ray-head \
            --network django-ray-live-cluster \
            --shm-size=1g \
            --publish 127.0.0.1:10001:10001 \
            rayproject/ray:2.56.0-py312 \
            bash -lc 'ray start --head --port=6379 \
              --ray-client-server-port=10001 --num-cpus=0 \
              --disable-usage-stats --block'
          docker run --detach --name ray-worker \
            --network django-ray-live-cluster \
            --shm-size=1g \
            rayproject/ray:2.56.0-py312 \
            bash -lc 'ray start --address=ray-head:6379 --num-cpus=1 \
              --disable-usage-stats --block'

      - name: Wait for two live Ray nodes
        run: |
          for attempt in $(seq 1 60); do
            if docker exec ray-head python -c 'import logging; import ray; ray.init(address="ray-head:6379", logging_level=logging.ERROR); assert sum(node["Alive"] for node in ray.nodes()) >= 2'; then
              exit 0
            fi
            sleep 2
          done
          docker logs ray-head
          docker logs ray-worker
          exit 1

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "latest"
          enable-cache: "false"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run live cluster fault tests
        run: uv run pytest tests/integration/test_live_failure_injection.py -m live_cluster -v

      - name: Show Ray container logs
        if: always()
        run: |
          docker logs ray-head || true
          docker logs ray-worker || true

      - name: Remove Ray containers
        if: always()
        run: |
          docker rm --force ray-worker ray-head || true
          docker network rm django-ray-live-cluster || true
