apiVersion: apps/v1
kind: Deployment
metadata:
  name: django-ray-worker-ray-job
  namespace: django-ray
  labels:
    app: django-ray
    component: worker
    queues: ray-data
    runner: ray-job
spec:
  replicas: 1
  selector:
    matchLabels:
      app: django-ray
      component: worker
      queues: ray-data
      runner: ray-job
  template:
    metadata:
      labels:
        app: django-ray
        component: worker
        queues: ray-data
        runner: ray-job
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z postgres-svc 5432; do echo waiting for postgres; sleep 2; done;"]
        - name: wait-for-ray-jobs
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z ray-head-svc 8265; do echo waiting for ray jobs; sleep 2; done;"]
        - name: wait-for-runtime-env
          image: busybox:1.36
          command: ["sh", "-c", "until test -f /runtime-env/django-ray-source.zip; do echo waiting for runtime env; sleep 2; done;"]
          volumeMounts:
            - name: runtime-env
              mountPath: /runtime-env
              readOnly: true
      containers:
        - name: django-ray-worker
          image: django-ray:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "testproject/manage.py", "django_ray_worker"]
          args:
            - "--queue"
            - "ray-data"
            - "--concurrency"
            - "1"
          envFrom:
            - configMapRef:
                name: django-ray-config
            - secretRef:
                name: django-ray-secret
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          volumeMounts:
            - name: runtime-env
              mountPath: /runtime-env
              readOnly: true
            - name: payload-storage
              mountPath: /payload-storage
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "test -d /proc/1 && grep -q python /proc/1/cmdline"
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "test -d /proc/1 && grep -q python /proc/1/cmdline"
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: runtime-env
          persistentVolumeClaim:
            claimName: runtime-env-pvc
        - name: payload-storage
          persistentVolumeClaim:
            claimName: payload-storage-pvc
