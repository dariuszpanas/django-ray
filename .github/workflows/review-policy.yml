name: YAGA Review Policy
run-name: >-
  ${{ github.event.action == 'edited' && github.event.changes.base == null &&
  format('YAGA metadata edit for #{0}', github.event.pull_request.number) ||
  format('YAGA {0} boundary for #{1}', github.event.action, github.event.pull_request.number) }}

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review, converted_to_draft]

permissions: {}

concurrency:
  group: >-
    yaga-review-policy-${{ github.event.pull_request.number }}-${{
    github.event.action == 'edited' && github.event.changes.base == null && github.run_id || 'boundary'
    }}
  cancel-in-progress: true

jobs:
  invalidate:
    if: vars.YAGA_CODEX_V2_ENABLED == 'true'
    name: >-
      ${{ github.event.action == 'edited' && github.event.changes.base == null &&
      'Review Policy Metadata' || 'Review Policy Boundary' }}
    permissions:
      actions: read
      contents: read
      pull-requests: read
      statuses: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Invalidate Review Policy
        uses: dariuszpanas/yaga@1cd83146d8881049adc00b092904e3ed6892f405
        with:
          gate: codex-review
          operation: invalidate
          github-token: ${{ secrets.GITHUB_TOKEN }}
          prerequisite-workflow: .github/workflows/ci.yml
          lifecycle-workflow: .github/workflows/review-policy.yml
          owner-id: ${{ vars.YAGA_CODEX_OWNER_ID }}
          job-timeout-minutes: 15
