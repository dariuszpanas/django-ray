[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "django-ray"
version = "0.8.0"
description = "Ray-based backend for Django Tasks with distributed execution and database-backed reliability"
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.12"
authors = [
    { name = "Dariusz Panas" },
]
keywords = [
    "django",
    "ray",
    "distributed",
    "tasks",
    "background-tasks",
    "task-queue",
    "async",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 6.0",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Distributed Computing",
]
dependencies = [
    "certifi>=2026.10.19",
    "cryptography>=42.0.8",
    "django>=6.0.8",
    "filelock>=4.2.1",
    "msgpack>=1.2.3",
    "multidict>=6.9.1",
    "opentelemetry-api>=1.45.1",
    "pyasn1>=0.6.5",
    "ray[default]>=2.60.0",
    "sqlparse>=0.6.0",
    "urllib3>=2.8.0",
    "virtualenv>=21.14.13",
]

[project.urls]
Homepage = "https://github.com/dariuszpanas/django-ray"
Documentation = "https://django-ray.readthedocs.io/en/latest/"
Repository = "https://github.com/dariuszpanas/django-ray"
Issues = "https://github.com/dariuszpanas/django-ray/issues"

[project.optional-dependencies]
otel = [
    "opentelemetry-sdk>=1.45.1",
]
postgres = [
    "psycopg[binary]>=3.1",
]
s3 = [
    "boto3>=1.35.75",
]
gcs = [
    "google-cloud-storage>=2.18",
]
object-storage = [
    "boto3>=1.35.75",
    "google-cloud-storage>=2.18",
]
sample = [
    "django-ninja>=1.5.1",
    "django-unfold==0.110.1",
    "gunicorn>=23.0",
    "whitenoise>=6.6",
]

[dependency-groups]
dev = [
    "django-ninja>=1.5.1",
    "django-unfold==0.110.1",
    "opentelemetry-sdk>=1.45.1",
    "whitenoise>=6.6",
    "ruff>=0.14.13",
    "ty>=0.0.102",
    "pytest>=8.3.3",
    "pytest-django>=4.7",
    "pytest-cov>=4.0",
    "pytest-xdist==3.8.0",
    "pyyaml>=6.0",
    "locust>=2.43",
    "pip-audit==2.10.1",
    "zensical>=0.0.42",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "C4",   # flake8-comprehensions
    "PIE",  # flake8-pie
]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["django_ray"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ty.environment]
python-version = "3.12"

[tool.ty.rules]
# Enforce core type-safety rules globally; narrow Django ORM / legacy stub
# exemptions are scoped strictly in [[tool.ty.overrides]] below.
missing-attribute = "error"
missing-union-attribute = "error"
invalid-argument-type = "error"
possibly-missing-attribute = "error"
invalid-assignment = "error"

[[tool.ty.overrides]]
# Django ORM `.objects` descriptors (no django-stubs) and POSIX-only helpers.
include = [
    "src/django_ray/doctor/probe.py",
    "src/django_ray/doctor/supervisor.py",
    "src/django_ray/input_storage.py",
    "src/django_ray/lease_policy.py",
    "src/django_ray/management/commands/django_ray_purge_executions.py",
    "src/django_ray/management/commands/django_ray_purge_inputs.py",
    "src/django_ray/management/commands/django_ray_replay.py",
    "src/django_ray/payload_registry.py",
    "src/django_ray/protocol_status.py",
    "src/django_ray/runtime/entrypoint.py",
    "src/django_ray/worker_readiness.py",
    "src/django_ray/workflow/progress/cleanup.py",
    "src/django_ray/workflow/progress/reporting_diagnostics.py",
    "src/django_ray/workflow/strategy.py",
]

[tool.ty.overrides.rules]
missing-attribute = "ignore"

[[tool.ty.overrides]]
# Narrowing / Ray / Django Field-descriptor argument-type gaps awaiting cleanup.
include = [
    "src/django_ray/doctor/contracts.py",
    "src/django_ray/execution_codec.py",
    "src/django_ray/management/purge_cursor.py",
    "src/django_ray/management/runtime_env_cursor.py",
    "src/django_ray/management/runtime_env_maintenance.py",
    "src/django_ray/runner/ray_job.py",
    "src/django_ray/runner/reconciliation.py",
    "src/django_ray/runtime/context.py",
    "src/django_ray/runtime/remote.py",
    "src/django_ray/runtime/result_fold.py",
    "src/django_ray/target/attestation.py",
    "src/django_ray/target/execution_codec.py",
    "src/django_ray/workflow/plans.py",
    "src/django_ray/workflow/progress/protocol.py",
    "src/django_ray/workflows.py",
]

[tool.ty.overrides.rules]
invalid-argument-type = "ignore"

[[tool.ty.overrides]]
# Django ORM PositiveIntegerField descriptor assignment.
include = ["src/django_ray/runner/retry.py"]

[tool.ty.overrides.rules]
invalid-assignment = "ignore"

[[tool.ty.overrides]]
# Ray Core / Ray Job protocol narrowing gaps.
include = [
    "src/django_ray/ray_job_protocol.py",
    "src/django_ray/runner/ray_core.py",
]

[tool.ty.overrides.rules]
invalid-argument-type = "ignore"
invalid-assignment = "ignore"

[[tool.ty.overrides]]
# Django ORM query/model modules (missing `.objects` + Field-descriptor args)
# and POSIX-only signal helpers with argument-narrowing gaps.
include = [
    "src/django_ray/backends.py",
    "src/django_ray/doctor/runner.py",
    "src/django_ray/management/commands/django_ray_benchmark_workflow_progress.py",
    "src/django_ray/metrics.py",
    "src/django_ray/observability.py",
    "src/django_ray/runner/leasing.py",
    "src/django_ray/target/capabilities.py",
    "src/django_ray/target/coordination.py",
    "src/django_ray/target/routing.py",
    "src/django_ray/workflow/progress/publication.py",
    "src/django_ray/workflow/progress/reads.py",
    "src/django_ray/workflow/progress/storage.py",
]

[tool.ty.overrides.rules]
missing-attribute = "ignore"
invalid-argument-type = "ignore"

[[tool.ty.overrides]]
# Full Django ORM / Admin / Worker state-mutation modules.
include = [
    "src/django_ray/admin.py",
    "src/django_ray/lifecycle.py",
    "src/django_ray/management/commands/django_ray_benchmark_polling.py",
    "src/django_ray/management/commands/django_ray_worker.py",
    "src/django_ray/protocol_coordination.py",
    "src/django_ray/ray_job_request_storage.py",
    "src/django_ray/runner/cancellation.py",
    "src/django_ray/target/probe.py",
    "src/django_ray/workflow/progress/runs.py",
]

[tool.ty.overrides.rules]
missing-attribute = "ignore"
invalid-argument-type = "ignore"
invalid-assignment = "ignore"

[[tool.ty.overrides]]
# Non-package tooling, sample app, qualification harnesses, docs, and tests.
include = [
    "docs/**",
    "locustfile.py",
    "qualification/**",
    "scripts/benchmark_distributed_preparation.py",
    "scripts/benchmark_workflow_progress_preparation.py",
    "scripts/benchmark_workflow_progress_publication.py",
    "scripts/benchmark_workflow_progress_reads.py",
    "scripts/check_python315_compatibility.py",
    "scripts/check_rq2_reference_compatibility.py",
    "scripts/compiled_session_topology_probe.py",
    "scripts/investigate_native_exit.py",
    "scripts/investigate_pytest_shutdown.py",
    "scripts/local_kuberay_gate.py",
    "scripts/ray_data_golden_path_probe.py",
    "scripts/test_suite_inventory.py",
    "scripts/verify_doctor_wheel.py",
    "scripts/verify_runtime_env_maintenance_wheel.py",
    "scripts/verify_wheel.py",
    "testproject/**",
    "tests/**",
]

[tool.ty.overrides.rules]
missing-attribute = "ignore"
invalid-argument-type = "ignore"
invalid-assignment = "ignore"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "compiled_graph_opt_in: Runs the capability-gated native Compiled Graph probe on local Ray",
    "live_cluster: Uses a shared external Ray cluster and must run in its serial opt-in lane",
    "postgresql: Uses the PostgreSQL coordination database and must run in its serial evidence lane",
    "sqlite_compatible: PostgreSQL-lane contracts that also run against the default SQLite database",
    "real_ray: Starts local Ray and must run serially without pytest-xdist",
]
filterwarnings = [
    # Suppress Ray's FutureWarning about accelerator env var override
    "ignore:Tip. In future versions of Ray:FutureWarning",
]

[tool.hatch.build.targets.wheel]
packages = ["src/django_ray"]

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
fail_under = 95
precision = 2
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.django_ray.coverage]
# Branch coverage is collected via `scripts/coverage_debt.py run-phases --branch`
# and `render --branch` using the ctrace core so Python 3.12 sysmon line-mode
# CI shards remain combine-compatible.
branch_supported = true
branch_fail_under = 85

[tool.django_ray.coverage.module_floors]
"src/django_ray/_blob_storage.py" = 85
"src/django_ray/_storage_types.py" = 85
"src/django_ray/_version.py" = 90
"src/django_ray/admin_views/__init__.py" = 90
"src/django_ray/admin_views/actions.py" = 90
"src/django_ray/admin_views/badges.py" = 90
"src/django_ray/admin_views/diagnostics.py" = 85
"src/django_ray/admin_views/sensitive.py" = 90
"src/django_ray/backends.py" = 90
"src/django_ray/conf/validation.py" = 90
"src/django_ray/decorators.py" = 90
"src/django_ray/execution_codec.py" = 90
"src/django_ray/input_storage.py" = 90
"src/django_ray/lease_policy.py" = 90
"src/django_ray/lifecycle.py" = 90
"src/django_ray/management/commands/django_ray_purge_executions.py" = 90
"src/django_ray/management/commands/django_ray_replay.py" = 90
"src/django_ray/management/commands/django_ray_worker.py" = 90
"src/django_ray/models.py" = 90
"src/django_ray/ray_job_protocol.py" = 90
"src/django_ray/result_storage.py" = 90
"src/django_ray/runner/cancellation.py" = 90
"src/django_ray/runner/leasing.py" = 90
"src/django_ray/runner/ray_core.py" = 90
"src/django_ray/runner/ray_job.py" = 90
"src/django_ray/runner/reconciliation.py" = 90
"src/django_ray/runner/sync.py" = 90
"src/django_ray/runtime/entrypoint.py" = 90
"src/django_ray/runtime/remote.py" = 90
"src/django_ray/worker/__init__.py" = 90
"src/django_ray/worker/claimer.py" = 85
"src/django_ray/worker/dispatcher.py" = 85
"src/django_ray/worker/loop.py" = 85
"src/django_ray/worker/maintenance.py" = 85
"src/django_ray/worker/reconciler.py" = 85
"src/django_ray/worker/shutdown.py" = 85
"src/django_ray/workflow/_types.py" = 85
"src/django_ray/workflow/dsl.py" = 90
