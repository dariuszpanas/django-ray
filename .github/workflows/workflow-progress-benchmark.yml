name: Workflow Progress Benchmark

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workflow-progress-benchmark-${{ github.ref }}
  cancel-in-progress: false

jobs:
  benchmark:
    name: PostgreSQL Workflow Progress Benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DJANGO_SETTINGS_MODULE: tests.postgres_settings
      DATABASE_NAME: django_ray
      DATABASE_TEST_NAME: test_django_ray
      DATABASE_USER: django_ray
      DATABASE_PASSWORD: django_ray
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: "5432"
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: django_ray
          POSTGRES_USER: django_ray
          POSTGRES_PASSWORD: django_ray
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U django_ray -d django_ray"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "latest"
          enable-cache: "false"

      - name: Set up supported Python
        run: uv python install 3.12

      - name: Install dependencies with PostgreSQL support
        run: |
          uv sync --frozen --extra postgres --python 3.12
          uv pip install --python .venv/bin/python "django==6.0"

      - name: Report benchmark versions
        run: |
          source .venv/bin/activate
          python --version
          python -c "import django, psycopg; print('Django', django.get_version()); print('psycopg', psycopg.__version__)"
          python -c "import platform; print(platform.platform())"
          python testproject/manage.py shell -c \
            "from django.db import connection; print('PostgreSQL', connection.pg_version)"

      - name: Check and migrate benchmark database
        run: |
          source .venv/bin/activate
          python testproject/manage.py check
          python testproject/manage.py migrate --noinput
          python testproject/manage.py migrate --check

      - name: Run workflow progress benchmark
        run: |
          source .venv/bin/activate
          mkdir -p artifacts
          python testproject/manage.py django_ray_benchmark_workflow_progress \
            --nodes 1000 10000 50000 100000 \
            --change-rates 0.01 0.10 1.0 \
            --repetitions 5 \
            --warmups 1 \
            --seed 20260720 \
            --database-deployment github-actions-service:postgres:17 \
            --output-json artifacts/workflow-progress-benchmark.json \
            --output-markdown artifacts/workflow-progress-benchmark.md

      - name: Add benchmark summary
        if: always()
        run: |
          if [ -f artifacts/workflow-progress-benchmark.md ]; then
            cat artifacts/workflow-progress-benchmark.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Workflow progress benchmark did not produce a Markdown summary." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload workflow progress benchmark evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: workflow-progress-benchmark-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/workflow-progress-benchmark.json
            artifacts/workflow-progress-benchmark.md
          if-no-files-found: warn
          retention-days: 14
