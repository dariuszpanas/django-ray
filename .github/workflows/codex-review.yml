name: Codex Review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review, converted_to_draft]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: codex-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  codex-review:
    name: Codex Review
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Wait for a current-head Codex review
        env:
          ACTION: ${{ github.event.action }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_CHANGED: ${{ github.event.changes.base != null }}
          BASELINE_TIME: ${{ github.event.pull_request.updated_at }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          base_change_args=()
          if [ "$ACTION" = "edited" ]; then
            base_change_args=(--base-changed "$BASE_CHANGED")
          fi

          python scripts/check_pr_review_policy.py \
            --mode codex \
            --repository "$GITHUB_REPOSITORY" \
            --pull-request "$PR_NUMBER" \
            --expected-base-ref "$BASE_REF" \
            --expected-base-sha "$BASE_SHA" \
            --expected-head "$HEAD_SHA" \
            --action "$ACTION" \
            "${base_change_args[@]}" \
            --baseline-time "$BASELINE_TIME" \
            --run-attempt "$RUN_ATTEMPT" \
            --poll-timeout 900 \
            --poll-interval 60
