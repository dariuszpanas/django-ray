# KubeRay operator-based deployment for local kind clusters.
# This path keeps django-web/django workers in Deployments and delegates
# Ray head/worker lifecycle to a RayCluster custom resource.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: django-ray

resources:
  - ../../base
  - ray-cluster-kuberay.yaml
  - worker-ml.yaml
  - worker-sync.yaml

patches:
  # This overlay targets a local kind cluster, not production.
  - patch: |-
      - op: replace
        path: /data/DJANGO_DEPLOYMENT_MODE
        value: "demo"
    target:
      kind: ConfigMap
      name: django-ray-config

  - patch: |-
      - op: replace
        path: /data/DJANGO_ALLOWED_HOSTS
        value: "localhost,127.0.0.1,django-ray.localhost"
    target:
      kind: ConfigMap
      name: django-ray-config

  # Kubelet connects to the pod IP but sends this stable, allowed Host header.
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/readinessProbe/httpGet/httpHeaders/0/value
        value: django-ray.localhost
      - op: replace
        path: /spec/template/spec/containers/0/livenessProbe/httpGet/httpHeaders/0/value
        value: django-ray.localhost
    target:
      kind: Deployment
      name: django-web

  # Exercise encrypted RuntimeEnv snapshots through the explicit Django-secret
  # fallback. Keep these settings on Django application processes only: generic
  # Ray pods neither encrypt nor decrypt durable task rows.
  - patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: DJANGO_RAY_RUNTIME_ENV_STORAGE_MODE
          value: encrypted
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: DJANGO_RAY_RUNTIME_ENV_ENCRYPTION_ACTIVE_KEY
          value: django-secret
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: DJANGO_RAY_RUNTIME_ENV_ENCRYPTION_DJANGO_SECRET_FALLBACK
          value: "true"
    target:
      kind: Deployment
      name: django-web

  # Remove legacy static Ray resources from base.
  - patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ray-head
        namespace: django-ray
    target:
      kind: Deployment
      name: ray-head

  - patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ray-worker
        namespace: django-ray
    target:
      kind: Deployment
      name: ray-worker

  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata:
        name: ray-head-svc
        namespace: django-ray
    target:
      kind: Service
      name: ray-head-svc

  # Enable Django debug mode for local iteration.
  - patch: |-
      - op: replace
        path: /data/DJANGO_DEBUG
        value: "True"
    target:
      kind: ConfigMap
      name: django-ray-config

  # Use multiple Django workers to better saturate a multi-node local cluster.
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
    target:
      kind: Deployment
      name: django-ray-worker

  - patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: DJANGO_RAY_RUNTIME_ENV_STORAGE_MODE
          value: encrypted
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: DJANGO_RAY_RUNTIME_ENV_ENCRYPTION_ACTIVE_KEY
          value: django-secret
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: DJANGO_RAY_RUNTIME_ENV_ENCRYPTION_DJANGO_SECRET_FALLBACK
          value: "true"
    target:
      kind: Deployment
      name: django-ray-worker

  - patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env
        value:
          - name: DJANGO_RAY_RUNTIME_ENV_STORAGE_MODE
            value: encrypted
          - name: DJANGO_RAY_RUNTIME_ENV_ENCRYPTION_ACTIVE_KEY
            value: django-secret
          - name: DJANGO_RAY_RUNTIME_ENV_ENCRYPTION_DJANGO_SECRET_FALLBACK
            value: "true"
    target:
      kind: Deployment
      name: django-ray-worker-sync

  - patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: DJANGO_RAY_RUNTIME_ENV_STORAGE_MODE
          value: encrypted
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: DJANGO_RAY_RUNTIME_ENV_ENCRYPTION_ACTIVE_KEY
          value: django-secret
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: DJANGO_RAY_RUNTIME_ENV_ENCRYPTION_DJANGO_SECRET_FALLBACK
          value: "true"
    target:
      kind: Deployment
      name: django-ray-worker-ml

  # Also consume the high-priority and low-priority queues from the default
  # worker pool so tasks submitted to them aren't stuck with no consumer.
  # ml/sync have their own dedicated worker deployments (worker-ml.yaml,
  # worker-sync.yaml) since they have different resource/runtime needs.
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/1/value
        value: "default,high-priority,low-priority"
    target:
      kind: Deployment
      name: django-ray-worker

images:
  - name: django-ray
    newName: django-ray
    newTag: latest
  - name: django-ray-worker
    newName: django-ray-worker
    newTag: latest
