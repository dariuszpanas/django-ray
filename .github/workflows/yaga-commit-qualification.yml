name: YAGA Commit Qualification

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: yaga-commit-qualification-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  candidate:
    name: YAGA Commit Candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch and verify PR commits
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          pr_ref="refs/remotes/pull/${PR_NUMBER}/head"
          git fetch --no-tags --force origin \
            "refs/pull/${PR_NUMBER}/head:${pr_ref}"
          test "$(git rev-parse "$pr_ref")" = "$PR_HEAD_SHA"
          git cat-file -e "${PR_BASE_SHA}^{commit}"
      - name: Install pinned Typos
        run: |
          set -euo pipefail
          tool_dir="$(mktemp -d "$RUNNER_TEMP/typos.XXXXXX")"
          archive="$tool_dir/typos.tar.gz"
          curl --fail --silent --show-error --location \
            https://github.com/crate-ci/typos/releases/download/v1.50.2/typos-v1.50.2-x86_64-unknown-linux-musl.tar.gz \
            --output "$archive"
          echo "abcb3e257c7c2abeff4d903f7fe68071357637605bdb283ce2251f44bc70dc09  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$tool_dir" ./typos
          "$tool_dir/typos" --version
          echo "$tool_dir" >> "$GITHUB_PATH"
      - uses: dariuszpanas/yaga/actions/commit-check@edd052701cb67a4bae0573d1654cd4de43d36073 # merged trusted spelling
        with:
          trusted-config: .yaga.toml
