name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    if: github.event_name != 'pull_request_target'
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "latest"
          enable-cache: "false"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Check linting
        run: uv run ruff check .

  docs:
    if: github.event_name != 'pull_request_target'
    name: Docs Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "latest"
          enable-cache: "false"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Build docs
        run: make docs-build-strict

  typecheck:
    if: github.event_name != 'pull_request_target'
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "latest"
          enable-cache: "false"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Type check
        run: uv run ty check

  test:
    if: github.event_name != 'pull_request_target'
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    env:
      COVERAGE_GLOBAL_MIN: "95"
      COVERAGE_WORKER_MIN: "90"
      COVERAGE_RAY_JOB_MIN: "90"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "latest"
          enable-cache: "false"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen --python ${{ matrix.python-version }}

      - name: Run tests
        run: uv run --python ${{ matrix.python-version }} pytest -m "not live_cluster" --cov=src --cov-report=xml --cov-report=term --cov-fail-under=${{ env.COVERAGE_GLOBAL_MIN }} -v

      - name: Enforce worker module coverage
        if: matrix.python-version == '3.12'
        run: uv run coverage report --include="src/django_ray/management/commands/django_ray_worker.py" --fail-under=${{ env.COVERAGE_WORKER_MIN }}

      - name: Enforce ray job module coverage
        if: matrix.python-version == '3.12'
        run: uv run coverage report --include="src/django_ray/runner/ray_job.py" --fail-under=${{ env.COVERAGE_RAY_JOB_MIN }}

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  postgresql-coordination:
    if: github.event_name != 'pull_request_target'
    name: PostgreSQL Coordination & Polling
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DJANGO_SETTINGS_MODULE: tests.postgres_settings
      DATABASE_NAME: django_ray
      DATABASE_TEST_NAME: test_django_ray
      DATABASE_USER: django_ray
      DATABASE_PASSWORD: django_ray
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: "5432"
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: django_ray
          POSTGRES_USER: django_ray
          POSTGRES_PASSWORD: django_ray
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U django_ray -d django_ray"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "latest"
          enable-cache: "false"

      - name: Set up minimum supported Python
        run: uv python install 3.12

      - name: Install dependencies with PostgreSQL support
        run: |
          uv sync --frozen --extra postgres --python 3.12
          uv pip install --python .venv/bin/python "django==6.0"

      - name: Report database test versions
        run: >-
          uv run --no-sync --python 3.12 python -c
          "import django, psycopg, sys; print(sys.version); print('Django', django.get_version()); print('psycopg', psycopg.__version__)"

      - name: Run PostgreSQL coordination and polling tests
        run: uv run --no-sync --python 3.12 make test-postgres

      - name: Show PostgreSQL diagnostics
        if: failure()
        run: |
          uv run --no-sync --python 3.12 python - <<'PY'
          import os
          import psycopg

          try:
              with psycopg.connect(
                  dbname=os.environ["DATABASE_NAME"],
                  user=os.environ["DATABASE_USER"],
                  password=os.environ["DATABASE_PASSWORD"],
                  host=os.environ["DATABASE_HOST"],
                  port=os.environ["DATABASE_PORT"],
              ) as connection:
                  with connection.cursor() as cursor:
                      cursor.execute("SELECT version(), current_database()")
                      print("PostgreSQL:", cursor.fetchone())
                      cursor.execute(
                          """
                          SELECT pid, state, wait_event_type, wait_event, left(query, 200)
                          FROM pg_stat_activity
                          WHERE datname = current_database()
                          ORDER BY pid
                          """
                      )
                      for activity in cursor.fetchall():
                          print("activity:", activity)
          except Exception as exc:
              print(f"PostgreSQL diagnostic connection failed: {type(exc).__name__}: {exc}")
              raise
          PY

  live-cluster:
    if: github.event_name != 'pull_request_target'
    name: Live Cluster Fault Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: live-cluster-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    env:
      DJANGO_RAY_LIVE_CLUSTER_TESTS: "1"
      DJANGO_RAY_LIVE_RAY_ADDRESS: ray://127.0.0.1:10001
      DJANGO_RAY_LIVE_MIN_NODES: "2"
      DJANGO_RAY_LIVE_WORKING_DIR_URI: file:///tmp/django-ray-source.zip
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Start a two-node Ray cluster
        run: |
          docker network create django-ray-live-cluster
          docker run --detach --name ray-head \
            --network django-ray-live-cluster \
            --shm-size=1g \
            --publish 127.0.0.1:10001:10001 \
            rayproject/ray:2.56.0-py312 \
            bash -lc 'ray start --head --port=6379 \
              --ray-client-server-port=10001 --num-cpus=0 \
              --disable-usage-stats --block'
          docker run --detach --name ray-worker \
            --network django-ray-live-cluster \
            --shm-size=1g \
            rayproject/ray:2.56.0-py312 \
            bash -lc 'ray start --address=ray-head:6379 --num-cpus=1 \
              --disable-usage-stats --block'

      - name: Wait for two live Ray nodes
        run: |
          for attempt in $(seq 1 60); do
            live_nodes="$(docker exec ray-head python -c 'import logging; import ray; ray.init(address="ray-head:6379", logging_level=logging.ERROR); print(sum(node["Alive"] for node in ray.nodes()))' 2>/dev/null || true)"
            if [[ "$live_nodes" =~ ^[0-9]+$ && "$live_nodes" -ge 2 ]]; then
              echo "Ray cluster is ready with $live_nodes live nodes."
              exit 0
            fi
            echo "Waiting for two live Ray nodes (attempt $attempt/60; observed ${live_nodes:-0})."
            sleep 2
          done
          docker logs ray-head
          docker logs ray-worker
          exit 1

      - name: Stage the project RuntimeEnv on Ray nodes
        run: |
          git archive --format=zip --output=/tmp/django-ray-source.zip HEAD
          docker cp /tmp/django-ray-source.zip ray-head:/tmp/django-ray-source.zip
          docker cp /tmp/django-ray-source.zip ray-worker:/tmp/django-ray-source.zip
          docker exec ray-head python -c "import importlib.util; assert importlib.util.find_spec('django_ray') is None"
          docker exec ray-worker python -c "import importlib.util; assert importlib.util.find_spec('django_ray') is None"

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "latest"
          enable-cache: "false"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run live cluster fault tests
        run: uv run pytest tests/integration/test_live_failure_injection.py -m live_cluster -v

      - name: Show Ray container logs
        if: always()
        run: |
          docker logs ray-head || true
          docker logs ray-worker || true

      - name: Remove Ray containers
        if: always()
        run: |
          docker rm --force ray-worker ray-head || true
          docker network rm django-ray-live-cluster || true

  testproject:
    name: Testproject Smoke
    runs-on: ubuntu-latest
    env:
      COVERAGE_TESTPROJECT_MIN: "80"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "latest"
          enable-cache: "false"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Validate sample project
        run: uv run make test-testproject

  dependency-compatibility:
    if: github.event_name != 'pull_request_target'
    name: Dependencies (${{ matrix.resolution }}, Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - resolution: minimum-direct
            python-version: "3.12"
          - resolution: latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "latest"
          enable-cache: "false"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install minimum supported dependencies
        if: matrix.resolution == 'minimum-direct'
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install --python .venv/bin/python \
            -e . \
            "django==6.0" \
            "ray[default]==2.53.0" \
            "django-ninja==1.5.1" \
            "whitenoise==6.6" \
            "pytest==7.0" \
            "pytest-django==4.7" \
            "pytest-cov==4.0"

      - name: Resolve and install latest dependencies
        if: matrix.resolution == 'latest'
        run: |
          uv lock --upgrade --python ${{ matrix.python-version }}
          uv sync --python ${{ matrix.python-version }}

      - name: Run tests
        run: >-
          uv run --no-sync --python ${{ matrix.python-version }}
          pytest -m "not live_cluster and not real_ray" -q

  compiled-graph-candidate-smoke:
    if: github.event_name != 'pull_request_target'
    name: Compiled Graph Candidate (Ray ${{ matrix.ray-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        ray-version: ["2.53.0", "2.56.0", "2.56.1"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "latest"
          enable-cache: "false"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install candidate with Compiled Graph dependencies
        run: |
          uv sync --frozen --python 3.12
          uv pip install --python .venv/bin/python "ray[cgraph]==${{ matrix.ray-version }}"

      - name: Record candidate environment
        run: |
          mkdir -p compiled-graph-evidence
          .venv/bin/python -c \
            "import json, platform, ray, sys; print(json.dumps({'python': sys.version, 'ray': ray.__version__, 'platform': platform.platform(), 'machine': platform.machine()}, indent=2, sort_keys=True))" \
            > compiled-graph-evidence/environment.json
          uv pip freeze --python .venv/bin/python \
            > compiled-graph-evidence/packages.txt

      - name: Probe production-intended nested owner
        run: >-
          .venv/bin/python -m
          django_ray.runtime.compiled_graph_probe
          --topology nested-ray-task
          --submission-transport direct-ray-core
          --candidate-native
          --require-success
          --timeout-seconds 90
          > compiled-graph-evidence/probe.json

      - name: Show Compiled Graph evidence
        if: always()
        run: |
          cat compiled-graph-evidence/environment.json || true
          cat compiled-graph-evidence/probe.json || true

      - name: Upload Compiled Graph evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compiled-graph-ray-${{ matrix.ray-version }}
          path: compiled-graph-evidence/

  build:
    if: github.event_name != 'pull_request_target'
    name: Build Package
    runs-on: ubuntu-latest
    needs:
      [
        lint,
        docs,
        typecheck,
        test,
        postgresql-coordination,
        live-cluster,
        testproject,
        dependency-compatibility,
        compiled-graph-candidate-smoke,
      ]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "latest"
          enable-cache: "false"

      - name: Set up Python
        run: uv python install 3.12

      - name: Build package
        run: uv build

      - name: Upload dist artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  ci-gate:
    name: CI Gate
    if: always()
    needs:
      - lint
      - docs
      - typecheck
      - test
      - postgresql-coordination
      - live-cluster
      - testproject
      - dependency-compatibility
      - compiled-graph-candidate-smoke
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Require every blocking CI job to succeed
        env:
          BLOCKING_JOB_RESULTS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os

          results = {
              job_id: details["result"]
              for job_id, details in json.loads(
                  os.environ["BLOCKING_JOB_RESULTS_JSON"]
              ).items()
          }
          if not results:
              raise SystemExit("CI Gate blocked: no blocking job results")

          expected_jobs = {
              "build",
              "compiled-graph-candidate-smoke",
              "dependency-compatibility",
              "docs",
              "lint",
              "live-cluster",
              "postgresql-coordination",
              "test",
              "testproject",
              "typecheck",
          }
          received_jobs = set(results)
          if received_jobs != expected_jobs:
              missing = ",".join(sorted(expected_jobs - received_jobs)) or "-"
              unexpected = ",".join(sorted(received_jobs - expected_jobs)) or "-"
              raise SystemExit(
                  "CI Gate blocked: result jobs mismatch; "
                  f"missing={missing}; unexpected={unexpected}"
              )

          for job_id, result in sorted(results.items()):
              print(f"{job_id}: {result}")

          unsuccessful = [
              f"{job_id}={result}"
              for job_id, result in sorted(results.items())
              if result != "success"
          ]
          if unsuccessful:
              raise SystemExit(
                  "CI Gate blocked: " + ", ".join(unsuccessful)
              )
          PY

