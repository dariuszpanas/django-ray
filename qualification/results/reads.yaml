namespace: django-ray
name: historical-result-reads-kubernetes-qualification
description: Verify installed-wheel historical reads and inert task projections in fresh Django processes.
revision: v1
schema_version: 1

definition:
  executor:
    kind: command
    payload:
      argv: [python, -m, qualification.results.scenario]
  requirements:
    capabilities: [external-evidence-v1, kubernetes, linux, python]
  timeout_seconds: 420
  evidence:
    max_artifacts: 3
    max_bytes_per_artifact: 1048576
    max_total_bytes: 3145728
    required_kinds: [junit, log, manifest]
  cleanup:
    policy: always
    timeout_seconds: 180
